# wapeB Danish Language File
# Language code: da

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Bandlysning
  TEMPBAN: Temp-Bandlysning
  IPBAN: IP-Bandlysning
  TEMPIPBAN: Temp-IP-Bandlysning
  MUTE: Mute
  TEMPMUTE: Temp-Mute
  IPMUTE: IP-Mute
  TEMPIPMUTE: Temp-IP-Mute
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Advarsel
  KICK: Kick
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: AI-Mute

# --- Time Formats ---
time-formats:
  permanent: Permanent
  year: ' år'
  week: ' uge(r)'
  day: ' dag(e)'
  hour: ' time(r)'
  minute: m
  second: s

console-name: Konsol

messages:
  no-permission: '%prefix% <red>Du har ikke tilladelse til at udføre denne kommando.'
  player-not-found: '%prefix% <red>Spiller ikke fundet.'
  invalid-ip: '%prefix% <red>Ugyldigt IP-adresseformat.'
  no-ip-history: '%prefix% <red>Ingen gemt IP-adresse fundet for spiller %player%.'
  not-banned: '%prefix% <red>Spilleren er ikke bandlyst.'
  not-muted: '%prefix% <red>Spilleren er ikke muted.'
  not-shadow-muted: '%prefix% <red>Spilleren er ikke shadow-muted.'
  invalid-punishment-id: '%prefix% <red>Ugyldigt straffe-ID.'
  no-warnings: '%prefix% <yellow>Denne spiller har ingen aktive advarsler.'
  no-history: '%prefix% <yellow>Denne spiller har ingen straffehistorik.'
  no-active-ban: '%prefix% <yellow>Denne spiller har ingen aktiv bandlysning.'
  no-active-mute: '%prefix% <yellow>Denne spiller har ingen aktiv mute.'
  no-active-shadowmute: '%prefix% <yellow>Denne spiller har ingen aktiv shadow-mute.'
  no-alts-found: '%prefix% <yellow>Ingen alternative konti fundet for %player%.'
  no-active-bans: '%prefix% <yellow>Der er ingen aktive bandlysninger på serveren.'
  no-staff-history: '%prefix% <yellow>Ingen historik fundet for personalemedlem %executor%.'
  rollback-success: '%prefix% <green>Straf #%punishment_id% (%type% for %player%) blev tilbagekaldt med succes.'
  rollback-usage: '%prefix% <white>Brug: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Brug: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Brug: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Brug: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Brug: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Brug: <red>/proof check <id>'
    set-success: '%prefix% <green>Bevis vedhæftet straf #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Bevis fjernet fra straf #%punishment_id%.'
    reset-success: '%prefix% <green>Bevis opdateret for straf #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>Der er intet bevis vedhæftet straf #%punishment_id%.'
    none: '<red>Ingen'
    status-active: '<green>Aktiv'
    status-inactive: '<red>Inaktiv'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Bevistjek #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Spiller: <color:#C34338>%player%'
      - '<white>Udført af: <color:#C34338>%executor%'
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Grund: <color:#C34338>%reason%'
      - '<white>Status: %status%'
      - '<white>Dato: <gray>%date%'
      - '<white>Bevis: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>Denne kommando kan kun udføres fra konsollen!'
  global-unban-success: '%prefix% <green>Alle aktive bandlysninger er blevet ophævet! (Global Unban).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>forsøgte at tilslutte, men er bandlyst (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>forsøgte at skrive, men er muted (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) forsøgte at skrive: <white>%message%'

  ban:
    usage: '%prefix% <white>Brug: <red>/ban <spiller> [tid] [grund] [-s]'
    default-reason: Overtrædelse af serverregler.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt bandlyst.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>bandlyste <color:#C34338>%player%<white>. Grund: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>DU ER BANDLYST</gradient></b>'
      - '%mid% <white>Du er blevet bandlyst fra denne server.'
      - ''
      - '%mid% Udført af: <color:#C34338>%executor%'
      - '%mid% Grund: <color:#C34338>%reason%'
      - '%mid% Udløber om: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Brug: <red>/kick <spiller> [grund] [-s]'
    default-reason: Kicket af personale.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt kicket.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>kickede <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>SERVER KICK</gradient></b>'
      - '%mid% Udført af: <color:#C34338>%executor%'
      - '%mid% Grund: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Brug: <red>/mute <spiller> [tid] [grund] [-s]'
    default-reason: Overtrædelse af chatregler.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt muted.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>mutede <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>Du er i øjeblikket muted! Udløber om: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Brug: <red>/shadowmute <spiller> [tid] [grund] [-s] [-ip]'
    default-reason: Overtrædelse af chatregler.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt shadow-muted.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>shadow-mutede <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Brug: <red>/unban <spiller> [grund] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt unbanned.'
    broadcast: '%prefix% <color:#C34338>%player% <white>blev unbanned.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Brug: <red>/unmute <spiller> [grund] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt unmuted.'
    broadcast: '%prefix% <color:#C34338>%player% <white>blev unmuted.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Brug: <red>/banip <spiller/IP> [tid] [grund] [-s]'
    default-reason: IP-Bandlysning.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt IP-bandlyst.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-bandlyste <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Brug: <red>/muteip <spiller/IP> [tid] [grund] [-s]'
    default-reason: IP-Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt IP-muted.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-mutede <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Brug: <red>/shadowmuteip <spiller/IP> [tid] [grund] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt IP-shadow-muted.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-shadow-mutede <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Brug: <red>/warn <spiller> <grund> [-s]'
    default-reason: Advarsel givet.
    success: '%prefix% <green><color:#C34338>%player%<green> har modtaget en advarsel.'
    player-warned: '%prefix% <yellow>Du har modtaget en advarsel! Grund: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>Du har modtaget en advarsel! Grund: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>advarede <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Brug: <red>/unwarn <spiller> <id> [-s]'
    success: '%prefix% <green>Advarsel for <color:#C34338>%player%<green> blev fjernet med succes.'
    broadcast: '%prefix% <color:#C34338>%player%''s <white>advarsel blev fjernet.'
    not-found: '%prefix% <red>Advarsels-ID ikke fundet.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Brug: <red>/kickall [grund]'
    default-reason: Servervedligeholdelse.
    success: '%prefix% <green>Alle spillere blev succesfuldt kicket.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>kickede alle spillere.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>SERVER KICK</gradient></b>'
      - '%mid% Udført af: <color:#C34338>%executor%'
      - '%mid% Grund: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Brug: <red>/warnings <spiller>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Advarsler for %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>Af: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Grund: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Brug: <red>/history <spiller> [side]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historik for %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>Af: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Grund: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Udløber: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Brug: <red>/checkban <spiller>'
    header: '<white>Tjek Bandlysning: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Udført af: <color:#C34338>%executor%'
      - '<white>Grund: <color:#C34338>%reason%'
      - '<white>Udløber om: <color:#C34338>%duration%'
      - '<white>Udløbsdato: <color:#C34338>%end_date%'
      - '<white>Straffe-ID: #<color:#C34338>%punishment_id%'
      - '<white>IP-Adresse: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Bevis: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Brug: <red>/checkmute <spiller>'
    header: '%prefix% <white>Tjek Mute: <color:#C34338>%player% <gray>(Mute)%alt_notice%'
    details:
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Udført af: <color:#C34338>%executor%'
      - '<white>Grund: <color:#C34338>%reason%'
      - '<white>Udløber om: <color:#C34338>%duration%'
      - '<white>Udløbsdato: <color:#C34338>%end_date%'
      - '<white>Straffe-ID: #<color:#C34338>%punishment_id%'
      - '<white>IP-Adresse: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Bevis: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Brug: <red>/alts <spiller>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Alternative konti for %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Sidst set: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANDLYST]</bold></red>'
      muted: '<yellow><bold>[MUTED]</bold></yellow>'
      online: '<green>[ONLINE]</green>'
      clean: '<gray>[REN]</gray>'
    status-colors:
      online: <green>[ONLINE]</green>
      clean: <gray>[REN]</gray>
      banned: <red><bold>[BANDLYST]</bold></red>
      muted: <yellow><bold>[MUTED]</bold></yellow>
      none: <white>[REN]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 UNDTAGET]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Advarsel:</yellow> <white>%player%</white> <gray>tilsluttede! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Klik for at se alternative konti:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Bandlyst: %banned_alts_count% | Muted: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Brug: <red>/altexempt <spiller> [add/remove]'
    added: '%prefix% <green><color:#C34338>%player%<green> blev succesfuldt undtaget fra alt-tjek.'
    removed: '%prefix% <green>Alt-undtagelse fjernet for <color:#C34338>%player%<green>.'

  freeze:
    frozen-target: '%prefix% <yellow>Du er blevet frosset af %executor%.'
    unfrozen-target: '%prefix% <green>Du er blevet optøet af %executor%.'

  banlist:
    usage: '%prefix% <white>Brug: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Aktive Bandlysninger</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) Af: <gradient:#FF00D9:#B300FF>%executor% <white>Grund: <gradient:#EC00E3:#D900EC>%reason% <gray>(Udløber: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Brug: <red>/staffhistory <personalenavn>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historik for %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Grund: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Brug: <red>/wapeb import <kilde> [fil/database]'
    unknown-source: '%prefix% <red>Ukendt importkilde: <yellow>%source%<red>. Tilgængelige kilder: <white>%sources%'
    started: '%prefix% <yellow>Starter import fra <gold>%source%<yellow>... Vent venligst!'
    success: '%prefix% <green>✔ Importeret fra <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Importeret: <green>%imported% <gray>| Sprunget over: <yellow>%skipped% <gray>| Fejlet: <red>%failed%'
    failed: '%prefix% <red>✖ Kunne ikke importere fra <gold>%source%!'
    list-header: '<gold>--- [ <yellow>wapeB Importører</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Hej! Vores server er i øjeblikket under vedligeholdelse.
    - '<white>Grund: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>Server lockdown er blevet aktiveret.'
    disabled: '%prefix% <green>Server lockdown er blevet deaktiveret.'
    usage: '%prefix% <white>Brug: <red>/lockdown <on|off> [grund]'
    reason-set: '%prefix% <green>Lockdown-grund sat til: <white>%reason%'
    status: '%prefix% <white>Lockdown status: <gradient:#FF00D9:#B300FF>%status% <white>Grund: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Brug: <red>/freeze <spiller> [grund]'
  ban-reason: Logget ud under frysning
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Du er blevet frosset af %executor%.'
    unfrozen: '%prefix% <green>Du er blevet optøet af %executor%.'
    frozen-success: '%prefix% <green>%player% blev frosset med succes.'
    unfrozen-success: '%prefix% <green>%player% blev optøet med succes.'
    already-frozen: '%prefix% <red>Spilleren er allerede frosset.'
    not-frozen: '%prefix% <red>Spilleren er ikke frosset.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>blev bandlyst for at logge ud under frysning.'
    freeze-screen:
      - ''
      - '%prefix% <white>Du er frosset!'
      - ''
      - <white>Log ikke ud, ellers bliver du bandlyst.

alts:
  usage: '%prefix% <white>Brug: <red>/alts <spiller>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Alternative konti for %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Sidst set: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[BANDLYST]</bold></red>'
    muted: '<yellow><bold>[MUTED]</bold></yellow>'
    online: '<green>[ONLINE]</green>'
    clean: '<gray>[REN]</gray>'
  status-colors:
    online: <green>[ONLINE]</green>
    clean: <gray>[REN]</gray>
    banned: <red><bold>[BANDLYST]</bold></red>
    muted: <yellow><bold>[MUTED]</bold></yellow>
    none: <white>[REN]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[🛡 UNDTAGET]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>er logget ind med alternative konti! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Brug: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Aktive Bandlysninger</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) Af: <gradient:#FF00D9:#B300FF>%executor% <white>Grund: <gradient:#EC00E3:#D900EC>%reason% <gray>(Udløber: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
  usage: '%prefix% <white>Brug: <red>/staffhistory <personalenavn>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historik for %executor%</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Grund: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
  footer: <dark_gray><st>----------------------------------------------------

web-api:
  messages:
    login-code: '%prefix% <white>Din login-kode er: <gradient:#FF00D9:#B300FF><bold>%code%</bold></gradient>'
    unlink-success: '%prefix% <green>Alle aktive web-sessioner er blevet logget ud.'

sentinel:
  messages:
    word-filter-blocked: '%prefix% <red>Din besked blev blokeret på grund af upassende indhold.'
    spam-blocked: '%prefix% <red>Din besked blev blokeret på grund af spam.'
    flood-blocked: '%prefix% <red>Din besked blev blokeret på grund af besked-flooding.'
    auto-muted: '%prefix% <red>Du er blevet muted i %duration% på grund af overtrædelse af chatregler.'
    ai-muted: '%prefix% <red>Du er blevet muted i %duration% af AI-moderation: %reason%'
    auto-mute-broadcast: '%prefix% <gradient:#FF00D9:#B300FF>%player% <white>blev muted af Sentinel i %duration%. Grund: %reason%'
    ai-mute-broadcast: '%prefix% <color:#C34338>%player% <white>blev muted af Sentinel AI.'

gui:
  title: 'Straf: %player%'
  items:
    ban_1d:
      material: 'REDSTONE'
      name: '<red>1 Dags Ban'
      lore:
        - '<gray>Bandlys spiller i 1 dag'
    ban_perm:
      material: 'BEDROCK'
      name: '<dark_red>Permanent Ban'
      lore:
        - '<gray>Bandlys spiller permanent'