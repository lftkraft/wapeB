# wapeB Portuguese Language File
# Language code: pt

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Banimento
  TEMPBAN: Temp-Banimento
  IPBAN: IP-Banimento
  TEMPIPBAN: Temp-IP-Banimento
  MUTE: Silenciamento
  TEMPMUTE: Temp-Silenciamento
  IPMUTE: IP-Silenciamento
  TEMPIPMUTE: Temp-IP-Silenciamento
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Aviso
  KICK: Expulsão
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: IA-Mute

# --- Time Formats ---
time-formats:
  permanent: Permanente
  year: ' ano(s)'
  week: ' semana(s)'
  day: ' dia(s)'
  hour: ' hora(s)'
  minute: m
  second: s

console-name: Consola

messages:
  no-permission: '%prefix% <red>Você não tem permissão para executar este comando.'
  player-not-found: '%prefix% <red>Jogador não encontrado.'
  invalid-ip: '%prefix% <red>Formato de endereço IP inválido.'
  no-ip-history: '%prefix% <red>Nenhum endereço IP registrado encontrado para o jogador %player%.'
  not-banned: '%prefix% <red>O jogador não está banido.'
  not-muted: '%prefix% <red>O jogador não está silenciado.'
  not-shadow-muted: '%prefix% <red>O jogador não está silenciado ocultamente.'
  invalid-punishment-id: '%prefix% <red>ID de punição inválido.'
  no-warnings: '%prefix% <yellow>Este jogador não possui avisos ativos.'
  no-history: '%prefix% <yellow>Este jogador não possui histórico de punições.'
  no-active-ban: '%prefix% <yellow>Este jogador não possui banimento ativo.'
  no-active-mute: '%prefix% <yellow>Este jogador não possui silenciamento ativo.'
  no-active-shadowmute: '%prefix% <yellow>Este jogador não possui nenhum shadow-mute ativo.'
  no-alts-found: '%prefix% <yellow>Nenhuma conta alternativa encontrada para %player%.'
  no-active-bans: '%prefix% <yellow>Não há banimentos ativos no servidor.'
  no-staff-history: '%prefix% <yellow>Nenhum histórico encontrado para o membro da staff %executor%.'
  rollback-success: '%prefix% <green>Punição #%punishment_id% (%type% para %player%) revogada com sucesso.'
  rollback-usage: '%prefix% <white>Uso: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Uso: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Uso: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Uso: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Uso: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Uso: <red>/proof check <id>'
    set-success: '%prefix% <green>Prova anexada com sucesso à punição #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Prova removida da punição #%punishment_id%.'
    reset-success: '%prefix% <green>Prova atualizada com sucesso para a punição #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>Não há provas anexadas à punição #%punishment_id%.'
    none: '<red>Nenhuma'
    status-active: '<green>Ativo'
    status-inactive: '<red>Inativo'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Verificação de Prova #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Jogador: <color:#C34338>%player%'
      - '<white>Aplicador: <color:#C34338>%executor%'
      - '<white>Tipo: <color:#C34338>%type%'
      - '<white>Motivo: <color:#C34338>%reason%'
      - '<white>Status: %status%'
      - '<white>Data: <gray>%date%'
      - '<white>Prova: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>Este comando só pode ser executado a partir do console!'
  global-unban-success: '%prefix% <green>Todos os banimentos ativos foram revogados! (Desbanimento Global).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>tentou entrar enquanto banido (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>tentou falar enquanto silenciado (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) tentou falar: <white>%message%'

  ban:
    usage: '%prefix% <white>Uso: <red>/ban <jogador> [tempo] [motivo] [-s]'
    default-reason: Violação das regras do servidor.
    success: '%prefix% <green><color:#C34338>%player%<green> foi banido com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>baniu <color:#C34338>%player%<white>. Motivo: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>VOCÊ FOI BANIDO</gradient></b>'
      - '%mid% <white>Você foi banido deste servidor.'
      - ''
      - '%mid% Aplicador: <color:#C34338>%executor%'
      - '%mid% Motivo: <color:#C34338>%reason%'
      - '%mid% Expira em: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Uso: <red>/kick <jogador> [motivo] [-s]'
    default-reason: Expulso pela staff.
    success: '%prefix% <green><color:#C34338>%player%<green> foi expulso com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>expulsou <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>EXPULSÃO DO SERVIDOR</gradient></b>'
      - '%mid% Aplicador: <color:#C34338>%executor%'
      - '%mid% Motivo: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Uso: <red>/mute <jogador> [tempo] [motivo] [-s]'
    default-reason: Violação das regras de chat.
    success: '%prefix% <green><color:#C34338>%player%<green> foi silenciado com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenciou <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>Você está silenciado atualmente! Expira em: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Uso: <red>/shadowmute <jogador> [tempo] [motivo] [-s] [-ip]'
    default-reason: Violação das regras de chat.
    success: '%prefix% <green><color:#C34338>%player%<green> foi silenciado ocultamente com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenciou ocultamente <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Uso: <red>/unban <jogador> [motivo] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> foi desbanido com sucesso.'
    broadcast: '%prefix% <color:#C34338>%player% <white>foi desbanido.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Uso: <red>/unmute <jogador> [motivo] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> foi dessilenciado com sucesso.'
    broadcast: '%prefix% <color:#C34338>%player% <white>foi dessilenciado.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Uso: <red>/banip <jogador/IP> [tempo] [motivo] [-s]'
    default-reason: Banimento por IP.
    success: '%prefix% <green><color:#C34338>%player%<green> foi banido por IP com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>baniu por IP <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Uso: <red>/muteip <jogador/IP> [tempo] [motivo] [-s]'
    default-reason: Silenciamento por IP.
    success: '%prefix% <green><color:#C34338>%player%<green> foi silenciado por IP com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenciou por IP <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Uso: <red>/shadowmuteip <jogador/IP> [tempo] [motivo] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> foi silenciado ocultamente por IP com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenciou ocultamente por IP <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Uso: <red>/warn <jogador> <motivo> [-s]'
    default-reason: Aviso emitido.
    success: '%prefix% <green><color:#C34338>%player%<green> recebeu um aviso com sucesso.'
    player-warned: '%prefix% <yellow>Você recebeu um aviso! Motivo: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>Você recebeu um aviso! Motivo: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>avisou <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Uso: <red>/unwarn <jogador> <id> [-s]'
    success: '%prefix% <green>Aviso removido para <color:#C34338>%player%<green> com sucesso.'
    broadcast: '%prefix% O aviso de <color:#C34338>%player% <white>foi removido.'
    not-found: '%prefix% <red>ID de aviso não encontrado.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Uso: <red>/kickall [motivo]'
    default-reason: Manutenção do servidor.
    success: '%prefix% <green>Todos os jogadores foram expulsos com sucesso.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>expulsou todos os jogadores.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>EXPULSÃO DO SERVIDOR</gradient></b>'
      - '%mid% Aplicador: <color:#C34338>%executor%'
      - '%mid% Motivo: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Uso: <red>/warnings <jogador>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Avisos de %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>Por: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Motivo: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Uso: <red>/history <jogador> [página]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Histórico de %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>Por: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Motivo: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Expira: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Uso: <red>/checkban <jogador>'
    header: '<white>Checar Banimento: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Tipo: <color:#C34338>%type%'
      - '<white>Aplicador: <color:#C34338>%executor%'
      - '<white>Motivo: <color:#C34338>%reason%'
      - '<white>Expira em: <color:#C34338>%duration%'
      - '<white>Data de Expiração: <color:#C34338>%end_date%'
      - '<white>ID de Punição: #<color:#C34338>%punishment_id%'
      - '<white>Endereço IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Prova: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Uso: <red>/checkmute <jogador>'
    header: '%prefix% <white>Checar Silenciamento: <color:#C34338>%player% <gray>(Mute)%alt_notice%'
    details:
      - '<white>Tipo: <color:#C34338>%type%'
      - '<white>Aplicador: <color:#C34338>%executor%'
      - '<white>Motivo: <color:#C34338>%reason%'
      - '<white>Expira em: <color:#C34338>%duration%'
      - '<white>Data de Expiração: <color:#C34338>%end_date%'
      - '<white>ID de Punição: #<color:#C34338>%punishment_id%'
      - '<white>Endereço IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Prova: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Uso: <red>/alts <jogador>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Contas secundárias de %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Visto por último: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANIDO]</bold></red>'
      muted: '<yellow><bold>[MUTADO]</bold></yellow>'
      online: '<green>[ONLINE]</green>'
      clean: '<gray>[LIMPO]</gray>'
    status-colors:
      online: <green>[ONLINE]</green>
      clean: <gray>[LIMPO]</gray>
      banned: <red><bold>[BANIDO]</bold></red>
      muted: <yellow><bold>[MUTADO]</bold></yellow>
      none: <white>[LIMPO]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 ISENTO]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Aviso:</yellow> <white>%player%</white> <gray>entrou! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Clique para ver contas secundárias:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Banido: %banned_alts_count% | Silenciado: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Uso: <red>/altexempt <jogador> [add/remove]'
    added: '%prefix% <green><color:#C34338>%player%<green> foi isento com sucesso das verificações de contas secundárias.'
    removed: '%prefix% <green>Isenção de contas secundárias removida para <color:#C34338>%player%<green> com sucesso.'

  freeze:
    frozen-target: '%prefix% <yellow>Você foi congelado por %executor%.'
    unfrozen-target: '%prefix% <green>Você foi descongelado por %executor%.'

  banlist:
    usage: '%prefix% <white>Uso: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Banimentos Ativos</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) Por: <gradient:#FF00D9:#B300FF>%executor% <white>Motivo: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expira: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Uso: <red>/staffhistory <membro_staff>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Histórico de %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Motivo: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Uso: <red>/wapeb import <fonte> [arquivo/banco_de_dados]'
    unknown-source: '%prefix% <red>Fonte de importação desconhecida: <yellow>%source%<red>. Fontes disponíveis: <white>%sources%'
    started: '%prefix% <yellow>Iniciando importação de <gold>%source%<yellow>... Por favor aguarde!'
    success: '%prefix% <green>✔ Importação concluída de <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Importados: <green>%imported% <gray>| Ignorados: <yellow>%skipped% <gray>| Falhas: <red>%failed%'
    failed: '%prefix% <red>✖ Falha ao importar de <gold>%source%!'
    list-header: '<gold>--- [ <yellow>Importadores wapeB</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Olá! Nosso servidor está em manutenção no momento.
    - '<white>Motivo: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>O bloqueio do servidor foi ativado.'
    disabled: '%prefix% <green>O bloqueio do servidor foi desativado.'
    usage: '%prefix% <white>Uso: <red>/lockdown <on|off> [motivo]'
    reason-set: '%prefix% <green>Motivo do bloqueio definido como: <white>%reason%'
    status: '%prefix% <white>Status do bloqueio: <gradient:#FF00D9:#B300FF>%status% <white>Motivo: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Uso: <red>/freeze <jogador> [motivo]'
  ban-reason: Desconectou-se enquanto congelado
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Você foi congelado por %executor%.'
    unfrozen: '%prefix% <green>Você foi descongelado por %executor%.'
    frozen-success: '%prefix% <green>%player% congelado com sucesso.'
    unfrozen-success: '%prefix% <green>%player% descongelado com sucesso.'
    already-frozen: '%prefix% <red>O jogador já está congelado.'
    not-frozen: '%prefix% <red>O jogador não está congelado.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>foi banido por desconectar-se congelado.'
    freeze-screen:
      - ''
      - '%prefix% <white>Você está congelado!'
      - ''
      - <white>Não se desconecte ou você será banido.

alts:
  usage: '%prefix% <white>Uso: <red>/alts <jogador>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Contas secundárias de %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Visto por último: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[BANIDO]</bold></red>'
    muted: '<yellow><bold>[MUTADO]</bold></yellow>'
    online: '<green>[ONLINE]</green>'
    clean: '<gray>[LIMPO]</gray>'
  status-colors:
    online: <green>[ONLINE]</green>
    clean: <gray>[LIMPO]</gray>
    banned: <red><bold>[BANIDO]</bold></red>
    muted: <yellow><bold>[MUTADO]</bold></yellow>
    none: <white>[LIMPO]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[🛡 ISENTO]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>entrou com contas secundárias! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Uso: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Banimentos Ativos</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) Por: <gradient:#FF00D9:#B300FF>%executor% <white>Motivo: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expira: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
  usage: '%prefix% <white>Uso: <red>/staffhistory <membro_staff>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Histórico de %executor%</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Motivo: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
  footer: <dark_gray><st>----------------------------------------------------

web-api:
  messages:
    login-code: '%prefix% <white>Seu código de login é: <gradient:#FF00D9:#B300FF><bold>%code%</bold></gradient>'
    unlink-success: '%prefix% <green>Todas as sessões web ativas foram encerradas.'

sentinel:
  messages:
    word-filter-blocked: '%prefix% <red>Sua mensagem foi bloqueada devido a conteúdo impróprio.'
    spam-blocked: '%prefix% <red>Sua mensagem foi bloqueada por spam.'
    flood-blocked: '%prefix% <red>Sua mensagem foi bloqueada por excesso de mensagens.'
    auto-muted: '%prefix% <red>Você foi silenciado por %duration% devido a violações das regras de chat.'
    ai-muted: '%prefix% <red>Você foi silenciado por %duration% pela moderação de IA: %reason%'
    auto-mute-broadcast: '%prefix% <gradient:#FF00D9:#B300FF>%player% <white>foi silenciado pelo Sentinel por %duration%. Motivo: %reason%'
    ai-mute-broadcast: '%prefix% <color:#C34338>%player% <white>foi silenciado pelo Sentinel IA.'

gui:
  title: 'Punir: %player%'
  items:
    ban_1d:
      material: 'REDSTONE'
      name: '<red>Ban 1 Dia'
      lore:
        - '<gray>Bane o jogador por 1 dia'
    ban_perm:
      material: 'BEDROCK'
      name: '<dark_red>Ban Permanente'
      lore:
        - '<gray>Bane o jogador permanentemente'