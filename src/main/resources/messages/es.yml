web-api:
  messages:
    login-code: '%prefix% <white>Tu código de acceso es: <gradient:#FF00D9:#B300FF><bold>%code%</bold></gradient>'
    unlink-success: '%prefix% <green>Se han cerrado todas las sesiones web activas.'

sentinel:
  messages:
    word-filter-blocked: '%prefix% <red>Tu mensaje fue bloqueado debido a contenido inapropiado.'
    spam-blocked: '%prefix% <red>Tu mensaje fue bloqueado por spam.'
    flood-blocked: '%prefix% <red>Tu mensaje fue bloqueado por flood.'
    auto-muted: '%prefix% <red>Has sido silenciado por %duration% debido a infracciones de chat.'
    ai-muted: '%prefix% <red>Has sido silenciado por %duration% por moderación IA: %reason%'
    auto-mute-broadcast: '%prefix% <gradient:#FF00D9:#B300FF>%player% <white>fue silenciado por Sentinel durante %duration%. Razón: %reason%'
    ai-mute-broadcast: '%prefix% <color:#C34338>%player% <white>fue silenciado por Sentinel IA.'

gui:
  title: 'Sancionar: %player%'
  items:
    ban_1d:
      material: 'REDSTONE'
      name: '<red>Ban 1 Día'
      lore:
        - '<gray>Banea al jugador por 1 día'
    ban_perm:
      material: 'BEDROCK'
      name: '<dark_red>Ban Permanente'
      lore:
        - '<gray>Banea permanentemente al jugador'