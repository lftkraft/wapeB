# wapeB Spanish Language File
# Language code: es

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Ban
  TEMPBAN: Temp-Ban
  IPBAN: IP-Ban
  TEMPIPBAN: Temp-IP-Ban
  MUTE: Silencio
  TEMPMUTE: Temp-Silencio
  IPMUTE: IP-Silencio
  TEMPIPMUTE: Temp-IP-Silencio
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Advertencia
  KICK: Expulsión
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Silencio
  SENTINEL_AI_MUTE: IA-Silencio

# --- Time Formats ---
time-formats:
  permanent: Permanente
  year: ' año(s)'
  week: ' semana(s)'
  day: ' día(s)'
  hour: ' hora(s)'
  minute: m
  second: s

console-name: Consola

messages:
  no-permission: '%prefix% <red>No tienes permisos para ejecutar este comando.'
  player-not-found: '%prefix% <red>Jugador no encontrado.'
  invalid-ip: '%prefix% <red>Formato de dirección IP inválido.'
  no-ip-history: '%prefix% <red>No se encontró ninguna IP registrada para el jugador %player%.'
  not-banned: '%prefix% <red>El jugador no está baneado.'
  not-muted: '%prefix% <red>El jugador no está silenciado.'
  not-shadow-muted: '%prefix% <red>El jugador no está silenciado en la sombra.'
  invalid-punishment-id: '%prefix% <red>ID de sanción inválido.'
  no-warnings: '%prefix% <yellow>Este jugador no tiene advertencias activas.'
  no-history: '%prefix% <yellow>Este jugador no tiene historial de sanciones.'
  no-active-ban: '%prefix% <yellow>Este jugador no tiene un ban activo.'
  no-active-mute: '%prefix% <yellow>Este jugador no tiene un silencio activo.'
  no-active-shadowmute: '%prefix% <yellow>Este jugador no tiene un shadow-mute activo.'
  no-alts-found: '%prefix% <yellow>No se encontraron cuentas secundarias para %player%.'
  no-active-bans: '%prefix% <yellow>No hay baneos activos en el servidor.'
  no-staff-history: '%prefix% <yellow>No se encontraron registros para el miembro del staff %executor%.'
  rollback-success: '%prefix% <green>Sanción #%punishment_id% (%type% para %player%) revocada con éxito.'
  rollback-usage: '%prefix% <white>Uso: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Uso: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Uso: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Uso: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Uso: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Uso: <red>/proof check <id>'
    set-success: '%prefix% <green>Prueba adjuntada con éxito a la sanción #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Prueba eliminada de la sanción #%punishment_id%.'
    reset-success: '%prefix% <green>Prueba actualizada con éxito para la sanción #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>No hay pruebas adjuntas a la sanción #%punishment_id%.'
    none: '<red>Ninguna'
    status-active: '<green>Activo'
    status-inactive: '<red>Inactivo'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Verificación de Prueba #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Jugador: <color:#C34338>%player%'
      - '<white>Sancionador: <color:#C34338>%executor%'
      - '<white>Tipo: <color:#C34338>%type%'
      - '<white>Razón: <color:#C34338>%reason%'
      - '<white>Estado: %status%'
      - '<white>Fecha: <gray>%date%'
      - '<white>Prueba: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>¡Este comando solo se puede ejecutar desde la consola!'
  global-unban-success: '%prefix% <green>¡Todos los baneos activos han sido revocados! (Desbaneo Global).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>intentó entrar estando baneado (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>intentó hablar estando silenciado (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) intentó hablar: <white>%message%'

  ban:
    usage: '%prefix% <white>Uso: <red>/ban <jugador> [tiempo] [razón] [-s]'
    default-reason: Violación de las reglas del servidor.
    success: '%prefix% <green>Se ha baneado a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>baneó a <color:#C34338>%player%<white>. Razón: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>ESTÁS BANEADO</gradient></b>'
      - '%mid% <white>Has sido baneado de este servidor.'
      - ''
      - '%mid% Sancionador: <color:#C34338>%executor%'
      - '%mid% Razón: <color:#C34338>%reason%'
      - '%mid% Expira en: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Uso: <red>/kick <jugador> [razón] [-s]'
    default-reason: Expulsado por un miembro del staff.
    success: '%prefix% <green>Se ha expulsado a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>expulsó a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>EXPULSIÓN DEL SERVIDOR</gradient></b>'
      - '%mid% Sancionador: <color:#C34338>%executor%'
      - '%mid% Razón: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Uso: <red>/mute <jugador> [tiempo] [razón] [-s]'
    default-reason: Violación de las reglas del chat.
    success: '%prefix% <green>Se ha silenciado a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenció a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>¡Estás silenciado actualmente! Expira en: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Uso: <red>/shadowmute <jugador> [tiempo] [razón] [-s] [-ip]'
    default-reason: Violación de las reglas del chat.
    success: '%prefix% <green>Se ha silenciado en la sombra a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenció en la sombra a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Uso: <red>/unban <jugador> [razón] [-s]'
    success: '%prefix% <green>Se ha desbaneado a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%player% <white>fue desbaneado.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Uso: <red>/unmute <jugador> [razón] [-s]'
    success: '%prefix% <green>Se ha desilenciado a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%player% <white>fue desilenciado.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Uso: <red>/banip <jugador/IP> [tiempo] [razón] [-s]'
    default-reason: Ban por IP.
    success: '%prefix% <green>Se ha baneado por IP a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>baneó por IP a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Uso: <red>/muteip <jugador/IP> [tiempo] [razón] [-s]'
    default-reason: Silencio por IP.
    success: '%prefix% <green>Se ha silenciado por IP a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenció por IP a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Uso: <red>/shadowmuteip <jugador/IP> [tiempo] [razón] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green>Se ha silenciado en la sombra por IP a <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>silenció en la sombra por IP a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Uso: <red>/warn <jugador> <razón> [-s]'
    default-reason: Advertencia emitida.
    success: '%prefix% <green>Se ha advertido a <color:#C34338>%player%<green>.'
    player-warned: '%prefix% <yellow>¡Has recibido una advertencia! Razón: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>¡Has recibido una advertencia! Razón: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>advirtió a <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Uso: <red>/unwarn <jugador> <id> [-s]'
    success: '%prefix% <green>Advertencia eliminada para <color:#C34338>%player%<green>.'
    broadcast: '%prefix% La advertencia de <color:#C34338>%player% <white>ha sido eliminada.'
    not-found: '%prefix% <red>ID de advertencia no encontrado.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Uso: <red>/kickall [razón]'
    default-reason: Mantenimiento del servidor.
    success: '%prefix% <green>Todos los jugadores han sido expulsados.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>expulsó a todos los jugadores.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>EXPULSIÓN DEL SERVIDOR</gradient></b>'
      - '%mid% Sancionador: <color:#C34338>%executor%'
      - '%mid% Razón: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Uso: <red>/warnings <jugador>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Advertencias de %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>Por: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Razón: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Uso: <red>/history <jugador> [página]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historial de %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>Por: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Razón: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Expira: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Uso: <red>/checkban <jugador>'
    header: '<white>Verificar Ban: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Tipo: <color:#C34338>%type%'
      - '<white>Sancionador: <color:#C34338>%executor%'
      - '<white>Razón: <color:#C34338>%reason%'
      - '<white>Expira en: <color:#C34338>%duration%'
      - '<white>Fecha de Expiración: <color:#C34338>%end_date%'
      - '<white>ID de Sanción: #<color:#C34338>%punishment_id%'
      - '<white>Dirección IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Prueba: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Uso: <red>/checkmute <jugador>'
    header: '%prefix% <white>Verificar Silencio: <color:#C34338>%player% <gray>(Silencio)%alt_notice%'
    details:
      - '<white>Tipo: <color:#C34338>%type%'
      - '<white>Sancionador: <color:#C34338>%executor%'
      - '<white>Razón: <color:#C34338>%reason%'
      - '<white>Expira en: <color:#C34338>%duration%'
      - '<white>Fecha de Expiración: <color:#C34338>%end_date%'
      - '<white>ID de Sanción: #<color:#C34338>%punishment_id%'
      - '<white>Dirección IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Prueba: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Uso: <red>/alts <jugador>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Multicuentas de %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Visto por última vez: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANEADO]</bold></red>'
      muted: '<yellow><bold>[SILENCIADO]</bold></yellow>'
      online: '<green>[ONLINE]</green>'
      clean: '<gray>[LIMPIO]</gray>'
    status-colors:
      online: <green>[ONLINE]</green>
      clean: <gray>[LIMPIO]</gray>
      banned: <red><bold>[BANEADO]</bold></red>
      muted: <yellow><bold>[SILENCIADO]</bold></yellow>
      none: <white>[LIMPIO]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 EXENTO]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Atención:</yellow> <white>%player%</white> <gray>ha entrado! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Clic para ver multicuentas:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Baneado: %banned_alts_count% | Silenciado: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Uso: <red>/altexempt <jugador> [add/remove]'
    added: '%prefix% <green>Se ha eximido a <color:#C34338>%player%<green> del chequeo de multicuentas.'
    removed: '%prefix% <green>Exención de multicuentas eliminada para <color:#C34338>%player%<green>.'

  freeze:
    frozen-target: '%prefix% <yellow>Has sido congelado por %executor%.'
    unfrozen-target: '%prefix% <green>Has sido descongelado por %executor%.'

  banlist:
    usage: '%prefix% <white>Uso: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Baneos Activos</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) Por: <gradient:#FF00D9:#B300FF>%executor% <white>Razón: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expira: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Uso: <red>/staffhistory <nombre_staff>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historial de %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Razón: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Uso: <red>/wapeb import <fuente> [archivo/base_de_datos]'
    unknown-source: '%prefix% <red>Fuente de importación desconocida: <yellow>%source%<red>. Fuentes disponibles: <white>%sources%'
    started: '%prefix% <yellow>Iniciando importación desde <gold>%source%<yellow>... ¡Por favor espera!'
    success: '%prefix% <green>✔ Importación exitosa desde <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Importados: <green>%imported% <gray>| Omitidos: <yellow>%skipped% <gray>| Fallidos: <red>%failed%'
    failed: '%prefix% <red>✖ ¡Error al importar desde <gold>%source%!'
    list-header: '<gold>--- [ <yellow>Importadores wapeB</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>¡Hola! Nuestro servidor está actualmente en mantenimiento.
    - '<white>Razón: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>El bloqueo del servidor ha sido activado.'
    disabled: '%prefix% <green>El bloqueo del servidor ha sido desactivado.'
    usage: '%prefix% <white>Uso: <red>/lockdown <on|off> [razón]'
    reason-set: '%prefix% <green>Razón del bloqueo establecida en: <white>%reason%'
    status: '%prefix% <white>Estado del bloqueo: <gradient:#FF00D9:#B300FF>%status% <white>Razón: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Uso: <red>/freeze <jugador> [razón]'
  ban-reason: Desconectarse mientras estaba congelado
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Has sido congelado por %executor%.'
    unfrozen: '%prefix% <green>Has sido descongelado por %executor%.'
    frozen-success: '%prefix% <green>%player% ha sido congelado con éxito.'
    unfrozen-success: '%prefix% <green>%player% ha sido descongelado con éxito.'
    already-frozen: '%prefix% <red>El jugador ya está congelado.'
    not-frozen: '%prefix% <red>El jugador no está congelado.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>fue baneado por desconectarse congelado.'
    freeze-screen:
      - ''
      - '%prefix% <white>¡Estás congelado!'
      - ''
      - <white>No te desconectes o serás baneado.

alts:
  usage: '%prefix% <white>Uso: <red>/alts <jugador>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Multicuentas de %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Visto por última vez: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[BANEADO]</bold></red>'
    muted: '<yellow><bold>[SILENCIADO]</bold></yellow>'
    online: '<green>[ONLINE]</green>'
    clean: '<gray>[LIMPIO]</gray>'
  status-colors:
    online: <green>[ONLINE]</green>
    clean: <gray>[LIMPIO]</gray>
    banned: <red><bold>[BANEADO]</bold></red>
    muted: <yellow><bold>[SILENCIADO]</bold></yellow>
    none: <white>[LIMPIO]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[🛡 EXENTO]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>ha entrado con multicuentas! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Uso: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Baneos Activos</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) Por: <gradient:#FF00D9:#B300FF>%executor% <white>Razón: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expira: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
  usage: '%prefix% <white>Uso: <red>/staffhistory <nombre_staff>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historial de %executor%</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Razón: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
