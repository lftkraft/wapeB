# wapeB English Language File (Default)
# Language code: en

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Ban
  TEMPBAN: Temp-Ban
  IPBAN: IP-Ban
  TEMPIPBAN: Temp-IP-Ban
  MUTE: Mute
  TEMPMUTE: Temp-Mute
  IPMUTE: IP-Mute
  TEMPIPMUTE: Temp-IP-Mute
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Warning
  KICK: Kick
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: AI-Mute

# --- Time Formats ---
time-formats:
  permanent: Permanent
  year: ' year(s)'
  week: ' week(s)'
  day: ' day(s)'
  hour: ' hour(s)'
  minute: m
  second: s

console-name: Console

messages:
  no-permission: '%prefix% <red>You do not have permission to execute this command.'
  player-not-found: '%prefix% <red>Player not found.'
  invalid-ip: '%prefix% <red>Invalid IP address format.'
  no-ip-history: '%prefix% <red>No recorded IP address found for player %player%.'
  not-banned: '%prefix% <red>Player is not banned.'
  not-muted: '%prefix% <red>Player is not muted.'
  not-shadow-muted: '%prefix% <red>Player is not shadow-muted.'
  invalid-punishment-id: '%prefix% <red>Invalid punishment ID.'
  no-warnings: '%prefix% <yellow>This player has no active warnings.'
  no-history: '%prefix% <yellow>This player has no punishment history.'
  no-active-ban: '%prefix% <yellow>This player has no active ban.'
  no-active-mute: '%prefix% <yellow>This player has no active mute.'
  no-active-shadowmute: '%prefix% <yellow>This player has no active shadow-mute.'
  no-alts-found: '%prefix% <yellow>No alternative accounts found for %player%.'
  no-active-bans: '%prefix% <yellow>There are no active bans on the server.'
  no-staff-history: '%prefix% <yellow>No history records found for staff member %executor%.'
  rollback-success: '%prefix% <green>Successfully revoked punishment #%punishment_id% (%type% for %player%).'
  rollback-usage: '%prefix% <white>Usage: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Usage: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Usage: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Usage: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Usage: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Usage: <red>/proof check <id>'
    set-success: '%prefix% <green>Successfully attached proof to punishment #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Successfully removed proof from punishment #%punishment_id%.'
    reset-success: '%prefix% <green>Successfully updated proof for punishment #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>There is no proof attached to punishment #%punishment_id%.'
    none: '<red>None'
    status-active: '<green>Active'
    status-inactive: '<red>Inactive'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Proof Check #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Player: <color:#C34338>%player%'
      - '<white>Executor: <color:#C34338>%executor%'
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Reason: <color:#C34338>%reason%'
      - '<white>Status: %status%'
      - '<white>Date: <gray>%date%'
      - '<white>Proof: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>This command can only be executed from the console!'
  global-unban-success: '%prefix% <green>All active bans have been revoked! (Global Unban).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>attempted to connect while banned (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>attempted to chat while muted (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) tried to chat: <white>%message%'

  ban:
    usage: '%prefix% <white>Usage: <red>/ban <player> [time] [reason] [-s]'
    default-reason: Violation of server rules.
    success: '%prefix% <green>Successfully banned <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>banned <color:#C34338>%player%<white>. Reason: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>YOU ARE BANNED</gradient></b>'
      - '%mid% <white>You have been banned from this server.'
      - ''
      - '%mid% Executor: <color:#C34338>%executor%'
      - '%mid% Reason: <color:#C34338>%reason%'
      - '%mid% Expires in: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Usage: <red>/kick <player> [reason] [-s]'
    default-reason: Kicked by staff member.
    success: '%prefix% <green>Successfully kicked <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>kicked <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>SERVER KICK</gradient></b>'
      - '%mid% Executor: <color:#C34338>%executor%'
      - '%mid% Reason: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Usage: <red>/mute <player> [time] [reason] [-s]'
    default-reason: Chat rules violation.
    success: '%prefix% <green>Successfully muted <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>muted <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>You are currently muted! Expires in: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Usage: <red>/shadowmute <player> [time] [reason] [-s] [-ip]'
    default-reason: Chat rules violation.
    success: '%prefix% <green>Successfully shadow-muted <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>shadow-muted <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Usage: <red>/unban <player> [reason] [-s]'
    success: '%prefix% <green>Successfully unbanned <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%player% <white>was unbanned.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Usage: <red>/unmute <player> [reason] [-s]'
    success: '%prefix% <green>Successfully unmuted <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%player% <white>was unmuted.'
    silent:
      prefix: '<gray>(Silent) '

  unshadowmute:
    usage: '%prefix% <white>Usage: <red>/unshadowmute <player> [reason] [-s]'
    success: '%prefix% <green>Successfully un-shadowmuted <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%player% <white>was un-shadowmuted.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Usage: <red>/banip <player/IP> [time] [reason] [-s]'
    default-reason: IP Ban.
    success: '%prefix% <green>Successfully IP-banned <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-banned <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Usage: <red>/muteip <player/IP> [time] [reason] [-s]'
    default-reason: IP Mute.
    success: '%prefix% <green>Successfully IP-muted <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-muted <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Usage: <red>/shadowmuteip <player/IP> [time] [reason] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green>Successfully IP-shadow-muted <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-shadow-muted <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Usage: <red>/warn <player> <reason> [-s]'
    default-reason: Warning issued.
    success: '%prefix% <green>Successfully warned <color:#C34338>%player%<green>.'
    player-warned: '%prefix% <yellow>You received a warning! Reason: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>You received a warning! Reason: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>warned <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Usage: <red>/unwarn <player> <id> [-s]'
    success: '%prefix% <green>Successfully removed warning from <color:#C34338>%player%<green>.'
    broadcast: '%prefix% <color:#C34338>%player%''s <white>warning was removed.'
    not-found: '%prefix% <red>Warning ID not found.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Usage: <red>/kickall [reason]'
    default-reason: Server maintenance.
    success: '%prefix% <green>Successfully kicked all players.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>kicked all players.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>SERVER KICK</gradient></b>'
      - '%mid% Executor: <color:#C34338>%executor%'
      - '%mid% Reason: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Usage: <red>/warnings <player>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>%player%'s Warnings</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>By: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Reason: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Usage: <red>/history <player> [page]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>%player%'s History (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>By: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Reason: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Expires: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Usage: <red>/checkban <player>'
    header: '<white>Check Ban: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Executor: <color:#C34338>%executor%'
      - '<white>Reason: <color:#C34338>%reason%'
      - '<white>Expires in: <color:#C34338>%duration%'
      - '<white>Expiration Date: <color:#C34338>%end_date%'
      - '<white>Punishment ID: #<color:#C34338>%punishment_id%'
      - '<white>IP Address: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Proof: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Usage: <red>/checkmute <player>'
    header: '%prefix% <white>Check Mute: <color:#C34338>%player% <gray>(Mute)%alt_notice%'
    details:
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Executor: <color:#C34338>%executor%'
      - '<white>Reason: <color:#C34338>%reason%'
      - '<white>Expires in: <color:#C34338>%duration%'
      - '<white>Expiration Date: <color:#C34338>%end_date%'
      - '<white>Punishment ID: #<color:#C34338>%punishment_id%'
      - '<white>IP Address: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Proof: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Usage: <red>/alts <player>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Alts for %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Last seen: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANNED]</bold></red>'
      muted: '<yellow><bold>[MUTED]</bold></yellow>'
      online: '<green>[ONLINE]</green>'
      clean: '<gray>[CLEAN]</gray>'
    status-colors:
      online: <green>[ONLINE]</green>
      clean: <gray>[CLEAN]</gray>
      banned: <red><bold>[BANNED]</bold></red>
      muted: <yellow><bold>[MUTED]</bold></yellow>
      none: <white>[CLEAN]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 EXEMPT]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Warning:</yellow> <white>%player%</white> <gray>joined! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Click to view alts:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Banned: %banned_alts_count% | Muted: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Usage: <red>/altexempt <player> [add/remove]'
    added: '%prefix% <green>Successfully exempted <color:#C34338>%player%<green> from alt-account checks.'
    removed: '%prefix% <green>Successfully removed alt-account exemption for <color:#C34338>%player%<green>.'

  freeze:
    frozen-target: '%prefix% <yellow>You have been frozen by %executor%.'
    unfrozen-target: '%prefix% <green>You have been unfrozen by %executor%.'

  banlist:
    usage: '%prefix% <white>Usage: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Active Bans</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) By: <gradient:#FF00D9:#B300FF>%executor% <white>Reason: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expires: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Usage: <red>/staffhistory <staff_name>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>%executor%'s History</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Reason: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Usage: <red>/wapeb import <source> [file/database]'
    unknown-source: '%prefix% <red>Unknown importer source: <yellow>%source%<red>. Available sources: <white>%sources%'
    started: '%prefix% <yellow>Starting import from <gold>%source%<yellow>... Please wait!'
    success: '%prefix% <green>✔ Successfully imported from <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Imported: <green>%imported% <gray>| Skipped: <yellow>%skipped% <gray>| Failed: <red>%failed%'
    failed: '%prefix% <red>✖ Failed to import from <gold>%source%!'
    list-header: '<gold>--- [ <yellow>wapeB Importers</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Hello! Our server is currently under maintenance.
    - '<white>Reason: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>Server lockdown has been enabled.'
    disabled: '%prefix% <green>Server lockdown has been disabled.'
    usage: '%prefix% <white>Usage: <red>/lockdown <on|off> [reason]'
    reason-set: '%prefix% <green>Lockdown reason set to: <white>%reason%'
    status: '%prefix% <white>Lockdown status: <gradient:#FF00D9:#B300FF>%status% <white>Reason: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Usage: <red>/freeze <player> [reason]'
  ban-reason: Logging out while frozen
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>You have been frozen by %executor%.'
    unfrozen: '%prefix% <green>You have been unfrozen by %executor%.'
    frozen-success: '%prefix% <green>Successfully froze %player%.'
    unfrozen-success: '%prefix% <green>Successfully unfrozen %player%.'
    already-frozen: '%prefix% <red>Player is already frozen.'
    not-frozen: '%prefix% <red>Player is not frozen.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>was banned for logging out while frozen.'
    freeze-screen:
      - ''
      - '%prefix% <white>You are frozen!'
      - ''
      - <white>Do not log out or you will be banned.

alts:
  usage: '%prefix% <white>Usage: <red>/alts <player>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Alts for %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Last seen: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[BANNED]</bold></red>'
    muted: '<yellow><bold>[MUTED]</bold></yellow>'
    online: '<green>[ONLINE]</green>'
    clean: '<gray>[CLEAN]</gray>'
  status-colors:
    online: <green>[ONLINE]</green>
    clean: <gray>[CLEAN]</gray>
    banned: <red><bold>[BANNED]</bold></red>
    muted: <yellow><bold>[MUTED]</bold></yellow>
    none: <white>[CLEAN]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[đź›ˇď¸Ź EXEMPT]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>has logged in with alts! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Usage: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Active Bans</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) By: <gradient:#FF00D9:#B300FF>%executor% <white>Reason: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expires: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
  usage: '%prefix% <white>Usage: <red>/staffhistory <staff_name>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>%executor%'s History</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Reason: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
  footer: <dark_gray><st>----------------------------------------------------

web-api:
  messages:
    login-code: '%prefix% <white>Your login code is: <gradient:#FF00D9:#B300FF><bold>%code%</bold></gradient>'
    unlink-success: '%prefix% <green>All active web sessions have been logged out.'

sentinel:
  messages:
    word-filter-blocked: '%prefix% <red>Your message was blocked due to inappropriate content.'
    spam-blocked: '%prefix% <red>Your message was blocked due to spam.'
    flood-blocked: '%prefix% <red>Your message was blocked due to message flooding.'
    auto-muted: '%prefix% <red>You have been muted for %duration% due to chat rule violations.'
    ai-muted: '%prefix% <red>You have been muted for %duration% by AI moderation: %reason%'
    auto-mute-broadcast: '%prefix% <gradient:#FF00D9:#B300FF>%player% <white>was muted by Sentinel for %duration%. Reason: %reason%'
    ai-mute-broadcast: '%prefix% <color:#C34338>%player% <white>was muted by Sentinel AI.'

gui:
  title: 'Punish: %player%'
  items:
    ban_1d:
      material: 'REDSTONE'
      name: '<red>1 Day Ban'
      lore:
        - '<gray>Ban player for 1 day'
    ban_perm:
      material: 'BEDROCK'
      name: '<dark_red>Permanent Ban'
      lore:
        - '<gray>Permanently ban player'