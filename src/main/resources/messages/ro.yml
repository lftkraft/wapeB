    unfrozen-success: '%prefix% <green>%player% a fost dezghețat cu succes.'
    already-frozen: '%prefix% <red>Jucătorul este deja înghețat.'
    not-frozen: '%prefix% <red>Jucătorul nu este înghețat.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>a fost banat pentru deconectare în timpul înghețării.'
    freeze-screen:
      - ''
      - '%prefix% <white>Ești înghețat!'
      - ''
      - <white>Nu te deconecta sau vei primi ban.

