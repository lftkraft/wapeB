# wapeB Romanian Language File
# Language code: ro

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Ban
  TEMPBAN: Temp-Ban
  IPBAN: IP-Ban
  TEMPIPBAN: Temp-IP-Ban
  MUTE: Mute
  TEMPMUTE: Temp-Mute
  IPMUTE: IP-Mute
  TEMPIPMUTE: Temp-IP-Mute
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Avertisment
  KICK: Kick
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: AI-Mute

# --- Time Formats ---
time-formats:
  permanent: Permanent
  year: ' an(i)'
  week: ' săptămână(i)'
  day: ' zi(le)'
  hour: ' oră(e)'
  minute: m
  second: s

console-name: Consolă

messages:
  no-permission: '%prefix% <red>Nu ai permisiunea de a executa această comandă.'
  player-not-found: '%prefix% <red>Jucătorul nu a fost găsit.'
  invalid-ip: '%prefix% <red>Format de adresă IP invalid.'
  no-ip-history: '%prefix% <red>Nu a fost găsită nicio adresă IP înregistrată pentru jucătorul %player%.'
  not-banned: '%prefix% <red>Jucătorul nu este banat.'
  not-muted: '%prefix% <red>Jucătorul nu are mute.'
  not-shadow-muted: '%prefix% <red>Jucătorul nu are shadow-mute.'
  invalid-punishment-id: '%prefix% <red>ID de sancțiune invalid.'
  no-warnings: '%prefix% <yellow>Acest jucător nu are avertismente active.'
  no-history: '%prefix% <yellow>Acest jucător nu are istoric de sancțiuni.'
  no-active-ban: '%prefix% <yellow>Acest jucător nu are un ban activ.'
  no-active-mute: '%prefix% <yellow>Acest jucător nu are un mute activ.'
  no-active-shadowmute: '%prefix% <yellow>Acest jucător nu are un shadow-mute activ.'
  no-alts-found: '%prefix% <yellow>Nu au fost găsite conturi secundare pentru %player%.'
  no-active-bans: '%prefix% <yellow>Nu există banuri active pe server.'
  no-staff-history: '%prefix% <yellow>Nu a fost găsit niciun istoric pentru membrul staff %executor%.'
  rollback-success: '%prefix% <green>Sancțiunea #%punishment_id% (%type% pentru %player%) a fost revocată cu succes.'
  rollback-usage: '%prefix% <white>Utilizare: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Utilizare: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Utilizare: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Utilizare: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Utilizare: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Utilizare: <red>/proof check <id>'
    set-success: '%prefix% <green>Dovadă atașată cu succes la sancțiunea #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Dovadă eliminată de la sancțiunea #%punishment_id%.'
    reset-success: '%prefix% <green>Dovadă actualizată cu succes pentru sancțiunea #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>Nu există dovezi atașate la sancțiunea #%punishment_id%.'
    none: '<red>Niciuna'
    status-active: '<green>Activ'
    status-inactive: '<red>Inactiv'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Verificare Dovadă #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Jucător: <color:#C34338>%player%'
      - '<white>Executant: <color:#C34338>%executor%'
      - '<white>Tip: <color:#C34338>%type%'
      - '<white>Motiv: <color:#C34338>%reason%'
      - '<white>Status: %status%'
      - '<white>Dată: <gray>%date%'
      - '<white>Dovadă: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>Această comandă poate fi executată doar din consolă!'
  global-unban-success: '%prefix% <green>Toate banurile active au fost revocate! (Unban Global).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>a încercat să se conecteze în timp ce era banat (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>a încercat să scrie în timp ce avea mute (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) a încercat să scrie: <white>%message%'

  ban:
    usage: '%prefix% <white>Utilizare: <red>/ban <jucător> [timp] [motiv] [-s]'
    default-reason: Încălcarea regulamentului serverului.
    success: '%prefix% <green><color:#C34338>%player%<green> a fost banat cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>l-a banat pe <color:#C34338>%player%<white>. Motiv: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>AI FOST BANAT</gradient></b>'
      - '%mid% <white>Ai fost banat de pe acest server.'
      - ''
      - '%mid% Executant: <color:#C34338>%executor%'
      - '%mid% Motiv: <color:#C34338>%reason%'
      - '%mid% Expiră în: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Utilizare: <red>/kick <jucător> [motiv] [-s]'
    default-reason: Dat afară de staff.
    success: '%prefix% <green><color:#C34338>%player%<green> a fost dat afară cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>l-a dat afară pe <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>KICK DE PE SERVER</gradient></b>'
      - '%mid% Executant: <color:#C34338>%executor%'
      - '%mid% Motiv: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Utilizare: <red>/mute <jucător> [timp] [motiv] [-s]'
    default-reason: Încălcarea regulilor de chat.
    success: '%prefix% <green><color:#C34338>%player%<green> a primit mute cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>i-a dat mute lui <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>Ai mute în prezent! Expiră în: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Utilizare: <red>/shadowmute <jucător> [timp] [motiv] [-s] [-ip]'
    default-reason: Încălcarea regulilor de chat.
    success: '%prefix% <green><color:#C34338>%player%<green> a primit shadow-mute cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a dat shadow-mute lui <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Utilizare: <red>/unban <jucător> [motiv] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> a fost debanat cu succes.'
    broadcast: '%prefix% <color:#C34338>%player% <white>a fost debanat.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Utilizare: <red>/unmute <jucător> [motiv] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> a primit unmute cu succes.'
    broadcast: '%prefix% <color:#C34338>%player% <white>a primit unmute.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Utilizare: <red>/banip <jucător/IP> [timp] [motiv] [-s]'
    default-reason: Ban pe IP.
    success: '%prefix% <green><color:#C34338>%player%<green> a primit IP-ban cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a dat IP-ban lui <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Utilizare: <red>/muteip <jucător/IP> [timp] [motiv] [-s]'
    default-reason: Mute pe IP.
    success: '%prefix% <green><color:#C34338>%player%<green> a primit IP-mute cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a dat IP-mute lui <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Utilizare: <red>/shadowmuteip <jucător/IP> [timp] [motiv] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> a primit IP-shadow-mute cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a dat IP-shadow-mute lui <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Utilizare: <red>/warn <jucător> <motiv> [-s]'
    default-reason: Avertisment acordat.
    success: '%prefix% <green><color:#C34338>%player%<green> a primit un avertisment cu succes.'
    player-warned: '%prefix% <yellow>Ai primit un avertisment! Motiv: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>Ai primit un avertisment! Motiv: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>l-a avertizat pe <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Utilizare: <red>/unwarn <jucător> <id> [-s]'
    success: '%prefix% <green>Avertismentul pentru <color:#C34338>%player%<green> a fost eliminat cu succes.'
    broadcast: '%prefix% Avertismentul lui <color:#C34338>%player% <white>a fost șters.'
    not-found: '%prefix% <red>ID-ul avertismentului nu a fost găsit.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Utilizare: <red>/kickall [motiv]'
    default-reason: Mentenanță server.
    success: '%prefix% <green>Toți jucătorii au fost dați afară cu succes.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a dat afară toți jucătorii.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>KICK DE PE SERVER</gradient></b>'
      - '%mid% Executant: <color:#C34338>%executor%'
      - '%mid% Motiv: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Utilizare: <red>/warnings <jucător>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Avertismentele lui %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>De către: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Motiv: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Utilizare: <red>/history <jucător> [pagină]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Istoricul lui %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>De către: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Motiv: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Expiră: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Utilizare: <red>/checkban <jucător>'
    header: '<white>Verificare Ban: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Tip: <color:#C34338>%type%'
      - '<white>Executant: <color:#C34338>%executor%'
      - '<white>Motiv: <color:#C34338>%reason%'
      - '<white>Expiră în: <color:#C34338>%duration%'
      - '<white>Dată Expirare: <color:#C34338>%end_date%'
      - '<white>ID Sancțiune: #<color:#C34338>%punishment_id%'
      - '<white>Adresă IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Dovadă: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Utilizare: <red>/checkmute <jucător>'
    header: '%prefix% <white>Verificare Mute: <color:#C34338>%player% <gray>(Mute)%alt_notice%'
    details:
      - '<white>Tip: <color:#C34338>%type%'
      - '<white>Executant: <color:#C34338>%executor%'
      - '<white>Motiv: <color:#C34338>%reason%'
      - '<white>Expiră în: <color:#C34338>%duration%'
      - '<white>Dată Expirare: <color:#C34338>%end_date%'
      - '<white>ID Sancțiune: #<color:#C34338>%punishment_id%'
      - '<white>Adresă IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Dovadă: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Utilizare: <red>/alts <jucător>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Conturi secundare pentru %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Văzut ultima dată: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANAT]</bold></red>'
      muted: '<yellow><bold>[MUTE]</bold></yellow>'
      online: '<green>[ONLINE]</green>'
      clean: '<gray>[CURAT]</gray>'
    status-colors:
      online: <green>[ONLINE]</green>
      clean: <gray>[CURAT]</gray>
      banned: <red><bold>[BANAT]</bold></red>
      muted: <yellow><bold>[MUTE]</bold></yellow>
      none: <white>[CURAT]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 SCUTIT]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Atenție:</yellow> <white>%player%</white> <gray>s-a conectat! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Click pentru a vedea conturile secundare:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Banat: %banned_alts_count% | Mute: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Utilizare: <red>/altexempt <jucător> [add/remove]'
    added: '%prefix% <green><color:#C34338>%player%<green> a fost scutit cu succes de la verificarea conturilor secundare.'
    removed: '%prefix% <green>Scutirea de conturi secundare a fost eliminată pentru <color:#C34338>%player%<green>.'

  freeze:
    frozen-target: '%prefix% <yellow>Ai fost înghețat de %executor%.'
    unfrozen-target: '%prefix% <green>Ai fost dezghețat de %executor%.'

  banlist:
    usage: '%prefix% <white>Utilizare: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Banuri Active</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) De către: <gradient:#FF00D9:#B300FF>%executor% <white>Motiv: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expiră: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Utilizare: <red>/staffhistory <membru_staff>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Istoricul lui %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Motiv: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Utilizare: <red>/wapeb import <sursă> [fișier/bază_de_date]'
    unknown-source: '%prefix% <red>Sursă de import necunoscută: <yellow>%source%<red>. Surse disponibile: <white>%sources%'
    started: '%prefix% <yellow>Se pornește importul din <gold>%source%<yellow>... Vă rugăm așteptați!'
    success: '%prefix% <green>✔ Importat cu succes din <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Importate: <green>%imported% <gray>| Ignorate: <yellow>%skipped% <gray>| Eșuate: <red>%failed%'
    failed: '%prefix% <red>✖ Eroare la importul din <gold>%source%!'
    list-header: '<gold>--- [ <yellow>Importatori wapeB</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Bună! Serverul nostru este momentan în mentenanță.
    - '<white>Motiv: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>Blocarea serverului a fost activată.'
    disabled: '%prefix% <green>Blocarea serverului a fost dezactivată.'
    usage: '%prefix% <white>Utilizare: <red>/lockdown <on|off> [motiv]'
    reason-set: '%prefix% <green>Motivul blocării a fost setat la: <white>%reason%'
    status: '%prefix% <white>Status blocare: <gradient:#FF00D9:#B300FF>%status% <white>Motiv: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Utilizare: <red>/freeze <jucător> [motiv]'
  ban-reason: Deconectare în timpul înghețării
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Ai fost înghețat de %executor%.'
    unfrozen: '%prefix% <green>Ai fost dezghețat de %executor%.'
