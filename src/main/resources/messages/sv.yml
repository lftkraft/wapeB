# wapeB Swedish Language File
# Language code: sv

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Bannlysning
  TEMPBAN: Temp-Bannlysning
  IPBAN: IP-Bannlysning
  TEMPIPBAN: Temp-IP-Bannlysning
  MUTE: Mute
  TEMPMUTE: Temp-Mute
  IPMUTE: IP-Mute
  TEMPIPMUTE: Temp-IP-Mute
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Varning
  KICK: Kick
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: AI-Mute

# --- Time Formats ---
time-formats:
  permanent: Permanent
  year: ' år'
  week: ' vecka/veckor'
  day: ' dag(ar)'
  hour: ' timme/timmar'
  minute: m
  second: s

console-name: Konsol

messages:
  no-permission: '%prefix% <red>Du har inte tillåtelse att använda detta kommando.'
  player-not-found: '%prefix% <red>Spelaren hittades inte.'
  invalid-ip: '%prefix% <red>Ogiltigt IP-adressformat.'
  no-ip-history: '%prefix% <red>Ingen sparad IP-adress hittades för spelaren %player%.'
  not-banned: '%prefix% <red>Spelaren är inte bannlyst.'
  not-muted: '%prefix% <red>Spelaren är inte mutad.'
  not-shadow-muted: '%prefix% <red>Spelaren är inte shadow-mutad.'
  invalid-punishment-id: '%prefix% <red>Ogiltigt straff-ID.'
  no-warnings: '%prefix% <yellow>Denna spelare har inga aktiva varningar.'
  no-history: '%prefix% <yellow>Denna spelare har ingen straffhistorik.'
  no-active-ban: '%prefix% <yellow>Denna spelare har ingen aktiv bannlysning.'
  no-active-mute: '%prefix% <yellow>Denna spelare har ingen aktiv mute.'
  no-active-shadowmute: '%prefix% <yellow>Denna spelare har ingen aktiv shadow-mute.'
  no-alts-found: '%prefix% <yellow>Inga alternativa konton hittades för %player%.'
  no-active-bans: '%prefix% <yellow>Det finns inga aktiva bannlysningar på servern.'
  no-staff-history: '%prefix% <yellow>Ingen historik hittades för personalmedlemmen %executor%.'
  rollback-success: '%prefix% <green>Straff #%punishment_id% (%type% för %player%) återkallades framgångsrikt.'
  rollback-usage: '%prefix% <white>Användning: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Användning: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Användning: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Användning: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Användning: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Användning: <red>/proof check <id>'
    set-success: '%prefix% <green>Bevis bifogat till straff #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Bevis borttaget från straff #%punishment_id%.'
    reset-success: '%prefix% <green>Bevis uppdaterat för straf #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>Det finns inget bevis bifogat till straff #%punishment_id%.'
    none: '<red>Inget'
    status-active: '<green>Aktiv'
    status-inactive: '<red>Inaktiv'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Beviskontroll #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Spelare: <color:#C34338>%player%'
      - '<white>Utförd av: <color:#C34338>%executor%'
      - '<white>Typ: <color:#C34338>%type%'
      - '<white>Anledning: <color:#C34338>%reason%'
      - '<white>Status: %status%'
      - '<white>Datum: <gray>%date%'
      - '<white>Bevis: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>Detta kommando kan endast köras från konsolen!'
  global-unban-success: '%prefix% <green>Alla aktiva bannlysningar har hävts! (Global Unban).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>försökte ansluta men är bannlyst (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>försökte skriva men är mutad (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) försökte skriva: <white>%message%'

  ban:
    usage: '%prefix% <white>Användning: <red>/ban <spelare> [tid] [anledning] [-s]'
    default-reason: Brott mot serverregler.
    success: '%prefix% <green><color:#C34338>%player%<green> har bannlysts framgångsrikt.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>bannlyste <color:#C34338>%player%<white>. Anledning: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>DU ÄR BANNLYST</gradient></b>'
      - '%mid% <white>Du har blivit bannlyst från denna server.'
      - ''
      - '%mid% Utförd av: <color:#C34338>%executor%'
      - '%mid% Anledning: <color:#C34338>%reason%'
      - '%mid% Går ut om: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Användning: <red>/kick <spelare> [anledning] [-s]'
    default-reason: Kickad av personal.
    success: '%prefix% <green><color:#C34338>%player%<green> har blivit kickad.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>kickade <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>SERVER KICK</gradient></b>'
      - '%mid% Utförd av: <color:#C34338>%executor%'
      - '%mid% Anledning: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Användning: <red>/mute <spelare> [tid] [anledning] [-s]'
    default-reason: Brott mot chattregler.
    success: '%prefix% <green><color:#C34338>%player%<green> har mutats framgångsrikt.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>mutade <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>Du är för närvarande mutad! Går ut om: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Användning: <red>/shadowmute <spelare> [tid] [anledning] [-s] [-ip]'
    default-reason: Brott mot chattregler.
    success: '%prefix% <green><color:#C34338>%player%<green> har shadow-mutats framgångsrikt.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>shadow-mutade <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Användning: <red>/unban <spelare> [anledning] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> har blivit avbannad.'
    broadcast: '%prefix% <color:#C34338>%player% <white>blev avbannad.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Användning: <red>/unmute <spelare> [anledning] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> har blivit avmutad.'
    broadcast: '%prefix% <color:#C34338>%player% <white>blev avmutad.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Användning: <red>/banip <spelare/IP> [tid] [anledning] [-s]'
    default-reason: IP-Bannlysning.
    success: '%prefix% <green><color:#C34338>%player%<green> har blivit IP-bannlyst.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-bannlyste <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Användning: <red>/muteip <spelare/IP> [tid] [anledning] [-s]'
    default-reason: IP-Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> har blivit IP-mutad.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-mutade <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Användning: <red>/shadowmuteip <spelare/IP> [tid] [anledning] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> har IP-shadow-mutats framgångsrikt.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>IP-shadow-mutade <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Användning: <red>/warn <spelare> <anledning> [-s]'
    default-reason: Varning utfärdad.
    success: '%prefix% <green><color:#C34338>%player%<green> har mottagit en varning.'
    player-warned: '%prefix% <yellow>Du har fått en varning! Anledning: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>Du har fått en varning! Anledning: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>varnade <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Användning: <red>/unwarn <spelare> <id> [-s]'
    success: '%prefix% <green>Varning för <color:#C34338>%player%<green> togs bort.'
    broadcast: '%prefix% Varningen för <color:#C34338>%player% <white>togs bort.'
    not-found: '%prefix% <red>Varnings-ID hittades inte.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Användning: <red>/kickall [anledning]'
    default-reason: Serverunderhåll.
    success: '%prefix% <green>Alla spelare har blivit kickade.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>kickade alla spelare.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>SERVER KICK</gradient></b>'
      - '%mid% Utförd av: <color:#C34338>%executor%'
      - '%mid% Anledning: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Användning: <red>/warnings <spelare>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Varningar för %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>Av: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Anledning: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Användning: <red>/history <spelare> [sida]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historik för %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>Av: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Anledning: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Går ut: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Användning: <red>/checkban <spelare>'
    header: '<white>Kontrollera Bannlysning: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Typ: <color:#C34338>%type%'
      - '<white>Utförd av: <color:#C34338>%executor%'
      - '<white>Anledning: <color:#C34338>%reason%'
      - '<white>Går ut om: <color:#C34338>%duration%'
      - '<white>Utgångsdatum: <color:#C34338>%end_date%'
      - '<white>Straff-ID: #<color:#C34338>%punishment_id%'
      - '<white>IP-Adress: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Bevis: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Användning: <red>/checkmute <spelare>'
    header: '%prefix% <white>Kontrollera Mute: <color:#C34338>%player% <gray>(Mute)%alt_notice%'
    details:
      - '<white>Typ: <color:#C34338>%type%'
      - '<white>Utförd av: <color:#C34338>%executor%'
      - '<white>Anledning: <color:#C34338>%reason%'
      - '<white>Går ut om: <color:#C34338>%duration%'
      - '<white>Utgångsdatum: <color:#C34338>%end_date%'
      - '<white>Straff-ID: #<color:#C34338>%punishment_id%'
      - '<white>IP-Adress: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Bevis: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Användning: <red>/alts <spelare>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Alternativa konton för %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Senast sedd: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANNLYST]</bold></red>'
      muted: '<yellow><bold>[MUTAD]</bold></yellow>'
      online: '<green>[ONLINE]</green>'
      clean: '<gray>[REN]</gray>'
    status-colors:
      online: <green>[ONLINE]</green>
      clean: <gray>[REN]</gray>
      banned: <red><bold>[BANNLYST]</bold></red>
      muted: <yellow><bold>[MUTAD]</bold></yellow>
      none: <white>[REN]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 UNDANTAGEN]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Varning:</yellow> <white>%player%</white> <gray>anslöt! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Klicka för att visa sekundära konton:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Bannlyst: %banned_alts_count% | Mutad: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Användning: <red>/altexempt <spelare> [add/remove]'
    added: '%prefix% <green><color:#C34338>%player%<green> har undantagits från alt-kontroller.'
    removed: '%prefix% <green>Undantag för alt-konton togs bort för <color:#C34338>%player%<green>.'

  freeze:
    frozen-target: '%prefix% <yellow>Du har blivit fryst av %executor%.'
    unfrozen-target: '%prefix% <green>Du har blivit avfrostad av %executor%.'

  banlist:
    usage: '%prefix% <white>Användning: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Aktiva Bannlysningar</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) Av: <gradient:#FF00D9:#B300FF>%executor% <white>Anledning: <gradient:#EC00E3:#D900EC>%reason% <gray>(Går ut: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Användning: <red>/staffhistory <personalnamn>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historik för %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Anledning: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Användning: <red>/wapeb import <källa> [fil/databas]'
    unknown-source: '%prefix% <red>Okänd importkälla: <yellow>%source%<red>. Tillgängliga källor: <white>%sources%'
    started: '%prefix% <yellow>Startar import från <gold>%source%<yellow>... Vänta!'
    success: '%prefix% <green>✔ Importerat från <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Importerade: <green>%imported% <gray>| Överhoppade: <yellow>%skipped% <gray>| Misslyckade: <red>%failed%'
    failed: '%prefix% <red>✖ Misslyckades att importera från <gold>%source%!'
    list-header: '<gold>--- [ <yellow>wapeB Importörer</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Hej! Vår server är för närvarande under underhåll.
    - '<white>Anledning: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>Server lockdown har aktiverats.'
    disabled: '%prefix% <green>Server lockdown har inaktiverats.'
    usage: '%prefix% <white>Användning: <red>/lockdown <on|off> [anledning]'
    reason-set: '%prefix% <green>Lockdown-anledning satt till: <white>%reason%'
    status: '%prefix% <white>Lockdown status: <gradient:#FF00D9:#B300FF>%status% <white>Anledning: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Användning: <red>/freeze <spelare> [anledning]'
  ban-reason: Loggade ut under frysning
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Du har blivit fryst av %executor%.'
    unfrozen: '%prefix% <green>Du har blivit avfrostad av %executor%.'
    frozen-success: '%prefix% <green>%player% frystes framgångsrikt.'
    unfrozen-success: '%prefix% <green>%player% avfrostades framgångsrikt.'
    already-frozen: '%prefix% <red>Spelaren är redan fryst.'
    not-frozen: '%prefix% <red>Spelaren är inte fryst.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>bannlystes för att ha loggat ut under frysning.'
    freeze-screen:
      - ''
      - '%prefix% <white>Du är fryst!'
      - ''
      - <white>Logga inte ut, annars blir du bannlyst.

alts:
  usage: '%prefix% <white>Användning: <red>/alts <spelare>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Alternativa konton för %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Senast sedd: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[BANNLYST]</bold></red>'
    muted: '<yellow><bold>[MUTAD]</bold></yellow>'
    online: '<green>[ONLINE]</green>'
    clean: '<gray>[REN]</gray>'
  status-colors:
    online: <green>[ONLINE]</green>
    clean: <gray>[REN]</gray>
    banned: <red><bold>[BANNLYST]</bold></red>
    muted: <yellow><bold>[MUTAD]</bold></yellow>
    none: <white>[REN]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[🛡 UNDANTAGEN]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>har loggat in med alternativa konton! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Användning: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Aktiva Bannlysningar</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) Av: <gradient:#FF00D9:#B300FF>%executor% <white>Anledning: <gradient:#EC00E3:#D900EC>%reason% <gray>(Går ut: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
  usage: '%prefix% <white>Användning: <red>/staffhistory <personalnamn>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historik för %executor%</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Anledning: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
  footer: <dark_gray><st>----------------------------------------------------

web-api:
  messages:
    login-code: '%prefix% <white>Din inloggningskod är: <gradient:#FF00D9:#B300FF><bold>%code%</bold></gradient>'
    unlink-success: '%prefix% <green>Alla aktiva webbsessioner har loggats ut.'

sentinel:
  messages:
    word-filter-blocked: '%prefix% <red>Ditt meddelande blockerades på grund av olämpligt innehåll.'
    spam-blocked: '%prefix% <red>Ditt meddelande blockerades på grund av spam.'
    flood-blocked: '%prefix% <red>Ditt meddelande blockerades på grund av meddelandeflödning.'
    auto-muted: '%prefix% <red>Du har blivit mutad i %duration% på grund av regelbrott i chatten.'
    ai-muted: '%prefix% <red>Du har blivit mutad i %duration% av AI-moderering: %reason%'
    auto-mute-broadcast: '%prefix% <gradient:#FF00D9:#B300FF>%player% <white>mutades av Sentinel i %duration%. Anledning: %reason%'
    ai-mute-broadcast: '%prefix% <color:#C34338>%player% <white>mutades av Sentinel AI.'

gui:
  title: 'Straffa: %player%'
  items:
    ban_1d:
      material: 'REDSTONE'
      name: '<red>1 Dags Ban'
      lore:
        - '<gray>Bannlys spelare i 1 dag'
    ban_perm:
      material: 'BEDROCK'
      name: '<dark_red>Permanent Ban'
      lore:
        - '<gray>Bannlys spelare permanent'