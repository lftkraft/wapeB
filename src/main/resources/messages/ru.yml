# wapeB Russian Language File
# Language code: ru

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Бан
  TEMPBAN: Временный бан
  IPBAN: Бан по IP
  TEMPIPBAN: Временный бан по IP
  MUTE: Мут
  TEMPMUTE: Временный мут
  IPMUTE: Мут по IP
  TEMPIPMUTE: Временный мут по IP
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Предупреждение
  KICK: Кик
  FREEZE_LOGOUT_BAN: Бан за выход в заморозке
  SENTINEL_AUTO_MUTE: Авто-мут
  SENTINEL_AI_MUTE: ИИ-мут

# --- Time Formats ---
time-formats:
  permanent: Навсегда
  year: ' г.'
  week: ' нед.'
  day: ' дн.'
  hour: ' ч.'
  minute: мин
  second: сек

console-name: Консоль

messages:
  no-permission: '%prefix% <red>У вас нет прав для выполнения этой команды.'
  player-not-found: '%prefix% <red>Игрок не найден.'
  invalid-ip: '%prefix% <red>Неверный формат IP-адреса.'
  no-ip-history: '%prefix% <red>Для игрока %player% не найдено сохраненных IP-адресов.'
  not-banned: '%prefix% <red>Игрок не забанен.'
  not-muted: '%prefix% <red>Игрок не заглушен.'
  not-shadow-muted: '%prefix% <red>Игрок не заблокирован скрытно в чате.'
  invalid-punishment-id: '%prefix% <red>Неверный ID наказания.'
  no-warnings: '%prefix% <yellow>У этого игрока нет активных предупреждений.'
  no-history: '%prefix% <yellow>У этого игрока нет истории наказаний.'
  no-active-ban: '%prefix% <yellow>У этого игрока нет активного бана.'
  no-active-mute: '%prefix% <yellow>У этого игрока нет активного мута.'
  no-active-shadowmute: '%prefix% <yellow>У этого игрока нет активного теневого мута.'
  no-alts-found: '%prefix% <yellow>Твинков для игрока %player% не найдено.'
  no-active-bans: '%prefix% <yellow>На сервере нет активных банов.'
  no-staff-history: '%prefix% <yellow>История для администратора %executor% не найдена.'
  rollback-success: '%prefix% <green>Наказание #%punishment_id% (%type% для %player%) успешно отменено.'
  rollback-usage: '%prefix% <white>Использование: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Использование: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Использование: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Использование: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Использование: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Использование: <red>/proof check <id>'
    set-success: '%prefix% <green>Доказательство успешно прикреплено к наказанию #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Доказательство удалено из наказания #%punishment_id%.'
    reset-success: '%prefix% <green>Доказательство обновлено для наказания #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>К наказанию #%punishment_id% не прикреплено доказательств.'
    none: '<red>Нет'
    status-active: '<green>Активно'
    status-inactive: '<red>Неактивно'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Проверка Доказательства #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Игрок: <color:#C34338>%player%'
      - '<white>Наказал: <color:#C34338>%executor%'
      - '<white>Тип: <color:#C34338>%type%'
      - '<white>Причина: <color:#C34338>%reason%'
      - '<white>Статус: %status%'
      - '<white>Дата: <gray>%date%'
      - '<white>Доказательство: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>Эту команду можно выполнять только из консоли!'
  global-unban-success: '%prefix% <green>Все активные баны были успешно сняты! (Глобальный разбан).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>пытался зайти, находясь в бане (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>пытался написать, находясь в муте (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) попытался написать: <white>%message%'

  ban:
    usage: '%prefix% <white>Использование: <red>/ban <игрок> [время] [причина] [-s]'
    default-reason: Нарушение правил сервера.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно забанен.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>забанил <color:#C34338>%player%<white>. Причина: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>ВЫ ЗАБАНЕНЫ</gradient></b>'
      - '%mid% <white>Вы были забанены на этом сервере.'
      - ''
      - '%mid% Забанил: <color:#C34338>%executor%'
      - '%mid% Причина: <color:#C34338>%reason%'
      - '%mid% Истекает через: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Использование: <red>/kick <игрок> [причина] [-s]'
    default-reason: Кикнут администрацией.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно кикнут.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>кикнул <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>КИК С СЕРВЕРА</gradient></b>'
      - '%mid% Кикнул: <color:#C34338>%executor%'
      - '%mid% Причина: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Использование: <red>/mute <игрок> [время] [причина] [-s]'
    default-reason: Нарушение правил чата.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно заглушен.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>заглушил <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>Вы заглушены в чате! Истекает через: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Использование: <red>/shadowmute <игрок> [время] [причина] [-s] [-ip]'
    default-reason: Нарушение правил чата.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно тенево заглушен.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>скрытно заглушил <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Использование: <red>/unban <игрок> [причина] [-s]'
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно разбанен.'
    broadcast: '%prefix% <color:#C34338>%player% <white>был разбанен.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Использование: <red>/unmute <игрок> [причина] [-s]'
    success: '%prefix% <green>С игрока <color:#C34338>%player%<green> снят мут.'
    broadcast: '%prefix% С игрока <color:#C34338>%player% <white>снят мут.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Использование: <red>/banip <игрок/IP> [время] [причина] [-s]'
    default-reason: Бан по IP.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно забанен по IP.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>забанил по IP <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Использование: <red>/muteip <игрок/IP> [время] [причина] [-s]'
    default-reason: Мут по IP.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно заглушен по IP.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>заглушил по IP <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Использование: <red>/shadowmuteip <игрок/IP> [время] [причина] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно скрытно заглушен по IP.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>скрытно заглушил по IP <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Использование: <red>/warn <игрок> <причина> [-s]'
    default-reason: Выдано предупреждение.
    success: '%prefix% <green>Предупреждение выдано игроку <color:#C34338>%player%<green>.'
    player-warned: '%prefix% <yellow>Вы получили предупреждение! Причина: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>Вы получили предупреждение! Причина: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>выдал предупреждение <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Использование: <red>/unwarn <игрок> <id> [-s]'
    success: '%prefix% <green>Предупреждение игрока <color:#C34338>%player%<green> успешно снято.'
    broadcast: '%prefix% Предупреждение игрока <color:#C34338>%player% <white>было снято.'
    not-found: '%prefix% <red>ID предупреждения не найден.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Использование: <red>/kickall [причина]'
    default-reason: Технические работы.
    success: '%prefix% <green>Все игроки были успешно кикнуты.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>кикнул всех игроков.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>КИК С СЕРВЕРА</gradient></b>'
      - '%mid% Кикнул: <color:#C34338>%executor%'
      - '%mid% Причина: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Использование: <red>/warnings <игрок>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Предупреждения %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>Выдал: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Причина: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Использование: <red>/history <игрок> [страница]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>История %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>Выдал: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Причина: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Истекает: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Использование: <red>/checkban <игрок>'
    header: '<white>Проверка бана: <color:#C34338>%player% <gray>(Бан)%alt_notice%'
    details:
      - '<white>Тип: <color:#C34338>%type%'
      - '<white>Забанил: <color:#C34338>%executor%'
      - '<white>Причина: <color:#C34338>%reason%'
      - '<white>Истекает через: <color:#C34338>%duration%'
      - '<white>Дата истечения: <color:#C34338>%end_date%'
      - '<white>ID наказания: #<color:#C34338>%punishment_id%'
      - '<white>IP-адрес: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Доказательство: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Использование: <red>/checkmute <игрок>'
    header: '%prefix% <white>Проверка мута: <color:#C34338>%player% <gray>(Мут)%alt_notice%'
    details:
      - '<white>Тип: <color:#C34338>%type%'
      - '<white>Заглушил: <color:#C34338>%executor%'
      - '<white>Причина: <color:#C34338>%reason%'
      - '<white>Истекает через: <color:#C34338>%duration%'
      - '<white>Дата истечения: <color:#C34338>%end_date%'
      - '<white>ID наказания: #<color:#C34338>%punishment_id%'
      - '<white>IP-адрес: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Доказательство: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Использование: <red>/alts <игрок>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Твинки для %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Был в сети: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[ЗАБАНЕН]</bold></red>'
      muted: '<yellow><bold>[ЗАМУЧЕН]</bold></yellow>'
      online: '<green>[ОНЛАЙН]</green>'
      clean: '<gray>[ЧИСТ]</gray>'
    status-colors:
      online: <green>[ОНЛАЙН]</green>
      clean: <gray>[ЧИСТ]</gray>
      banned: <red><bold>[ЗАБАНЕН]</bold></red>
      muted: <yellow><bold>[ЗАМУЧЕН]</bold></yellow>
      none: <white>[ЧИСТ]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 ИСКЛЮЧЕН]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Внимание:</yellow> <white>%player%</white> <gray>зашел! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Нажмите для просмотра твинков:\n%alts_hover%''><gold>[Твинки: %total_alts_count% | Забанен: %banned_alts_count% | Замучен: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Использование: <red>/altexempt <игрок> [add/remove]'
    added: '%prefix% <green>Игрок <color:#C34338>%player%<green> успешно добавлен в исключения проверки твинков.'
    removed: '%prefix% <green>Игрок <color:#C34338>%player%<green> удален из исключений проверки твинков.'

  freeze:
    frozen-target: '%prefix% <yellow>Вы были заморожены администратором %executor%.'
    unfrozen-target: '%prefix% <green>Вы были разморожены администратором %executor%.'

  banlist:
    usage: '%prefix% <white>Использование: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Активные Баны</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) Забанил: <gradient:#FF00D9:#B300FF>%executor% <white>Причина: <gradient:#EC00E3:#D900EC>%reason% <gray>(Истекает: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Использование: <red>/staffhistory <администратор>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>История %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Причина: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Использование: <red>/wapeb import <источник> [файл/база_данных]'
    unknown-source: '%prefix% <red>Неизвестный источник импорта: <yellow>%source%<red>. Доступные источники: <white>%sources%'
    started: '%prefix% <yellow>Начало импорта из <gold>%source%<yellow>... Пожалуйста, подождите!'
    success: '%prefix% <green>✔ Успешно импортировано из <gold>%source% <gray>(<white>%duration%мс<gray>)'
    summary: '%prefix% <gray>Импортировано: <green>%imported% <gray>| Пропущено: <yellow>%skipped% <gray>| Ошибок: <red>%failed%'
    failed: '%prefix% <red>✖ Ошибка импорта из <gold>%source%!'
    list-header: '<gold>--- [ <yellow>Импортеры wapeB</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Здравствуйте! Наш сервер временно закрыт на технические работы.
    - '<white>Причина: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>Блокировка сервера была включена.'
    disabled: '%prefix% <green>Блокировка сервера была выключена.'
    usage: '%prefix% <white>Использование: <red>/lockdown <on|off> [причина]'
    reason-set: '%prefix% <green>Причина блокировки установлена: <white>%reason%'
    status: '%prefix% <white>Статус блокировки: <gradient:#FF00D9:#B300FF>%status% <white>Причина: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Использование: <red>/freeze <игрок> [причина]'
  ban-reason: Выход с сервера во время заморозки
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Вы были заморожены администратором %executor%.'
    unfrozen: '%prefix% <green>Вы были разморожены администратором %executor%.'
    frozen-success: '%prefix% <green>Игрок %player% успешно заморожен.'
    unfrozen-success: '%prefix% <green>Игрок %player% успешно разморожен.'
    already-frozen: '%prefix% <red>Игрок уже заморожен.'
    not-frozen: '%prefix% <red>Игрок не заморожен.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>был забанен за выход во время заморозки.'
    freeze-screen:
      - ''
      - '%prefix% <white>Вы заморожены!'
      - ''
      - <white>Не выходите из игры, иначе получите бан.

alts:
  usage: '%prefix% <white>Использование: <red>/alts <игрок>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Твинки для %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Был в сети: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[ЗАБАНЕН]</bold></red>'
    muted: '<yellow><bold>[ЗАМУЧЕН]</bold></yellow>'
    online: '<green>[ОНЛАЙН]</green>'
    clean: '<gray>[ЧИСТ]</gray>'
  status-colors:
    online: <green>[ОНЛАЙН]</green>
    clean: <gray>[ЧИСТ]</gray>
    banned: <red><bold>[ЗАБАНЕН]</bold></red>
    muted: <yellow><bold>[ЗАМУЧЕН]</bold></yellow>
    none: <white>[ЧИСТ]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[🛡 ИСКЛЮЧЕН]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>зашел с твинками! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Использование: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Активные Баны</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) Забанил: <gradient:#FF00D9:#B300FF>%executor% <white>Причина: <gradient:#EC00E3:#D900EC>%reason% <gray>(Истекает: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
