# wapeB French Language File
# Language code: fr

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Bannissement
  TEMPBAN: Temp-Bannissement
  IPBAN: IP-Bannissement
  TEMPIPBAN: Temp-IP-Bannissement
  MUTE: Mute
  TEMPMUTE: Temp-Mute
  IPMUTE: IP-Mute
  TEMPIPMUTE: Temp-IP-Mute
  SHADOWMUTE: Shadow-Mute
  TEMPSHADOWMUTE: Temp-Shadow-Mute
  IPSHADOWMUTE: IP-Shadow-Mute
  TEMPIPSHADOWMUTE: Temp-IP-Shadow-Mute
  WARN: Avertissement
  KICK: Expulsion
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: IA-Mute

# --- Time Formats ---
time-formats:
  permanent: Permanent
  year: ' an(s)'
  week: ' semaine(s)'
  day: ' jour(s)'
  hour: ' heure(s)'
  minute: m
  second: s

console-name: Console

messages:
  no-permission: '%prefix% <red>Vous n''avez pas la permission d''exécuter cette commande.'
  player-not-found: '%prefix% <red>Joueur introuvable.'
  invalid-ip: '%prefix% <red>Format d''adresse IP invalide.'
  no-ip-history: '%prefix% <red>Aucune adresse IP enregistrée pour le joueur %player%.'
  not-banned: '%prefix% <red>Le joueur n''est pas banni.'
  not-muted: '%prefix% <red>Le joueur n''est pas mute.'
  not-shadow-muted: '%prefix% <red>Le joueur n''est pas shadow-mute.'
  invalid-punishment-id: '%prefix% <red>ID de sanction invalide.'
  no-warnings: '%prefix% <yellow>Ce joueur n''a aucun avertissement actif.'
  no-history: '%prefix% <yellow>Ce joueur n''a aucun historique de sanctions.'
  no-active-ban: '%prefix% <yellow>Ce joueur n''a aucun bannissement actif.'
  no-active-mute: '%prefix% <yellow>Ce joueur n''a aucun mute actif.'
  no-active-shadowmute: '%prefix% <yellow>Ce joueur n''a aucun shadow-mute actif.'
  no-alts-found: '%prefix% <yellow>Aucun compte secondaire trouvé pour %player%.'
  no-active-bans: '%prefix% <yellow>Il n''y a aucun bannissement actif sur le serveur.'
  no-staff-history: '%prefix% <yellow>Aucun historique trouvé pour le membre du staff %executor%.'
  rollback-success: '%prefix% <green>Sanction #%punishment_id% (%type% pour %player%) révoquée avec succès.'
  rollback-usage: '%prefix% <white>Utilisation: <red>/punish-rollback <id>'
  proof:
    usage: '%prefix% <white>Utilisation: <red>/proof <set|remove|reset|check> <id> [url]'
    set-usage: '%prefix% <white>Utilisation: <red>/proof set <id> <url>'
    remove-usage: '%prefix% <white>Utilisation: <red>/proof remove <id>'
    reset-usage: '%prefix% <white>Utilisation: <red>/proof reset <id> <url>'
    check-usage: '%prefix% <white>Utilisation: <red>/proof check <id>'
    set-success: '%prefix% <green>Preuve ajoutée avec succès à la sanction #%punishment_id%: <yellow>%proof%'
    remove-success: '%prefix% <green>Preuve retirée de la sanction #%punishment_id%.'
    reset-success: '%prefix% <green>Preuve mise à jour pour la sanction #%punishment_id%: <yellow>%proof%'
    no-proof: '%prefix% <yellow>Aucune preuve attachée à la sanction #%punishment_id%.'
    none: '<red>Aucune'
    status-active: '<green>Actif'
    status-inactive: '<red>Inactif'
    check-header: '<dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Vérification Preuve #%punishment_id%</gradient> <dark_gray><st>------------------'
    check-details:
      - '<white>Joueur: <color:#C34338>%player%'
      - '<white>Modérateur: <color:#C34338>%executor%'
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Raison: <color:#C34338>%reason%'
      - '<white>Statut: %status%'
      - '<white>Date: <gray>%date%'
      - '<white>Preuve: <yellow>%proof%'
    check-footer: '<dark_gray><st>----------------------------------------------------'
  console-only: '%prefix% <red>Cette commande ne peut être exécutée que depuis la console!'
  global-unban-success: '%prefix% <green>Tous les bannissements actifs ont été révoqués! (Débannissement Global).'

  punishment-notification:
    permission: wapeb.notify.punishment
    shadowmute-permission: wapeb.shadowmute.notify
    ban-attempt: '%prefix% <color:#C34338>%player% <white>a tenté de se connecter en étant banni (<color:#C34338>%duration%<white>).'
    mute-attempt: '%prefix% <color:#C34338>%player% <white>a tenté d''écrire en étant mute (<color:#C34338>%duration%<white>).'
    shadowmute-attempt: '%prefix% <gradient:#8a2be2:#4b0082>[ShadowMute]</gradient> <color:#C34338>%player% <white>(ShadowMuted) a tenté d''écrire: <white>%message%'

  ban:
    usage: '%prefix% <white>Utilisation: <red>/ban <joueur> [temps] [raison] [-s]'
    default-reason: Violation des règles du serveur.
    success: '%prefix% <green><color:#C34338>%player%<green> a été banni avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a banni <color:#C34338>%player%<white>. Raison: <color:#C34338>%reason%'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>VOUS ÊTES BANNI</gradient></b>'
      - '%mid% <white>Vous avez été banni de ce serveur.'
      - ''
      - '%mid% Modérateur: <color:#C34338>%executor%'
      - '%mid% Raison: <color:#C34338>%reason%'
      - '%mid% Expire dans: <color:#C34338>%duration%'
      - '%mid% ID: #%punishment_id%'

  kick:
    usage: '%prefix% <white>Utilisation: <red>/kick <joueur> [raison] [-s]'
    default-reason: Expulsé par un modérateur.
    success: '%prefix% <green><color:#C34338>%player%<green> a été expulsé avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a expulsé <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>EXPULSION DU SERVEUR</gradient></b>'
      - '%mid% Modérateur: <color:#C34338>%executor%'
      - '%mid% Raison: <color:#C34338>%reason%'

  mute:
    usage: '%prefix% <white>Utilisation: <red>/mute <joueur> [temps] [raison] [-s]'
    default-reason: Violation des règles du chat.
    success: '%prefix% <green><color:#C34338>%player%<green> a été mute avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a mute <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '
    player-is-muted: "%prefix% <red>Vous êtes actuellement mute! Expire dans: <color:#C34338>%duration%"

  shadowmute:
    usage: '%prefix% <white>Utilisation: <red>/shadowmute <joueur> [temps] [raison] [-s] [-ip]'
    default-reason: Violation des règles du chat.
    success: '%prefix% <green><color:#C34338>%player%<green> a été shadow-mute avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a shadow-mute <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unban:
    usage: '%prefix% <white>Utilisation: <red>/unban <joueur> [raison] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> a été débanni avec succès.'
    broadcast: '%prefix% <color:#C34338>%player% <white>a été débanni.'
    silent:
      prefix: '<gray>(Silent) '

  unmute:
    usage: '%prefix% <white>Utilisation: <red>/unmute <joueur> [raison] [-s]'
    success: '%prefix% <green><color:#C34338>%player%<green> a été démute avec succès.'
    broadcast: '%prefix% <color:#C34338>%player% <white>a été démute.'
    silent:
      prefix: '<gray>(Silent) '

  banip:
    usage: '%prefix% <white>Utilisation: <red>/banip <joueur/IP> [temps] [raison] [-s]'
    default-reason: IP Bannissement.
    success: '%prefix% <green><color:#C34338>%player%<green> a été IP-banni avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a IP-banni <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  muteip:
    usage: '%prefix% <white>Utilisation: <red>/muteip <joueur/IP> [temps] [raison] [-s]'
    default-reason: IP Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> a été IP-mute avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a IP-mute <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  shadowmuteip:
    usage: '%prefix% <white>Utilisation: <red>/shadowmuteip <joueur/IP> [temps] [raison] [-s]'
    default-reason: IP Shadow Mute.
    success: '%prefix% <green><color:#C34338>%player%<green> a été IP-shadow-mute avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a IP-shadow-mute <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  warn:
    usage: '%prefix% <white>Utilisation: <red>/warn <joueur> <raison> [-s]'
    default-reason: Avertissement émis.
    success: '%prefix% <green><color:#C34338>%player%<green> a reçu un avertissement avec succès.'
    player-warned: '%prefix% <yellow>Vous avez reçu un avertissement! Raison: <color:#C34338>%reason%'
    target-notify: '%prefix% <yellow>Vous avez reçu un avertissement! Raison: <color:#C34338>%reason%'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a averti <color:#C34338>%player%<white>.'
    silent:
      prefix: '<gray>(Silent) '

  unwarn:
    usage: '%prefix% <white>Utilisation: <red>/unwarn <joueur> <id> [-s]'
    success: '%prefix% <green>Avertissement retiré pour <color:#C34338>%player%<green> avec succès.'
    broadcast: '%prefix% L''avertissement de <color:#C34338>%player% <white>a été retiré.'
    not-found: '%prefix% <red>ID d''avertissement introuvable.'
    silent:
      prefix: '<gray>(Silent) '

  kickall:
    usage: '%prefix% <white>Utilisation: <red>/kickall [raison]'
    default-reason: Maintenance du serveur.
    success: '%prefix% <green>Tous les joueurs ont été expulsés avec succès.'
    broadcast: '%prefix% <color:#C34338>%executor% <white>a expulsé tous les joueurs.'
    kick-screen:
      - '%mid% <b><gradient:#C34338:#C63528>EXPULSION DU SERVEUR</gradient></b>'
      - '%mid% Modérateur: <color:#C34338>%executor%'
      - '%mid% Raison: <color:#C34338>%reason%'

  warnings:
    usage: '%prefix% <white>Utilisation: <red>/warnings <joueur>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Avertissements de %player%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <white>Par: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Raison: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  history:
    usage: '%prefix% <white>Utilisation: <red>/history <joueur> [page]'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historique de %player% (%page%/%max_page%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>Par: <gradient:#FF00D9:#B300FF>%executor%</gradient> <white>Raison: <gradient:#EC00E3:#D900EC>%reason%</gradient> <gray>(%date%) - Expire: %end_date%'
    footer: <dark_gray><st>----------------------------------------------------

  checkban:
    usage: '%prefix% <white>Utilisation: <red>/checkban <joueur>'
    header: '<white>Vérification Ban: <color:#C34338>%player% <gray>(Ban)%alt_notice%'
    details:
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Modérateur: <color:#C34338>%executor%'
      - '<white>Raison: <color:#C34338>%reason%'
      - '<white>Expire dans: <color:#C34338>%duration%'
      - '<white>Date d''expiration: <color:#C34338>%end_date%'
      - '<white>ID de sanction: #<color:#C34338>%punishment_id%'
      - '<white>Adresse IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Preuve: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  checkmute:
    usage: '%prefix% <white>Utilisation: <red>/checkmute <joueur>'
    header: '%prefix% <white>Vérification Mute: <color:#C34338>%player% <gray>(Mute)%alt_notice%'
    details:
      - '<white>Type: <color:#C34338>%type%'
      - '<white>Modérateur: <color:#C34338>%executor%'
      - '<white>Raison: <color:#C34338>%reason%'
      - '<white>Expire dans: <color:#C34338>%duration%'
      - '<white>Date d''expiration: <color:#C34338>%end_date%'
      - '<white>ID de sanction: #<color:#C34338>%punishment_id%'
      - '<white>Adresse IP: <color:#C34338>%ip_address%'
      - '<white>GeoIP: <color:#C34338>%geoip%'
      - '<white>Preuve: <yellow>%proof%'
    footer: <dark_gray><st>----------------------------------------------------

  alts:
    usage: '%prefix% <white>Utilisation: <red>/alts <joueur>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Comptes secondaires de %player% (%alt_count%)</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Dernière connexion: %last_seen%)'
    footer: <dark_gray><st>----------------------------------------------------
    status:
      banned: '<red><bold>[BANNI]</bold></red>'
      muted: '<yellow><bold>[MUTE]</bold></yellow>'
      online: '<green>[EN LIGNE]</green>'
      clean: '<gray>[PROPRE]</gray>'
    status-colors:
      online: <green>[EN LIGNE]</green>
      clean: <gray>[PROPRE]</gray>
      banned: <red><bold>[BANNI]</bold></red>
      muted: <yellow><bold>[MUTE]</bold></yellow>
      none: <white>[PROPRE]</white>
    tags:
      exempt: '<gradient:#00FFCC:#0099FF>[🛡 EXEMPTÉ]</gradient>'
      cidr: '<dark_purple>[CIDR /24]</dark_purple>'
    login-notification: '<gradient:#ff9900:#ff5500>[wapeB]</gradient> <yellow>Attention:</yellow> <white>%player%</white> <gray>s''est connecté! <click:run_command:''/alts %player%''><hover:show_text:''<gray>Cliquez pour voir les comptes secondaires:\n%alts_hover%''><gold>[Alts: %total_alts_count% | Banni: %banned_alts_count% | Mute: %muted_alts_count%]</gold></hover></click></gray>'

  altexempt:
    usage: '%prefix% <white>Utilisation: <red>/altexempt <joueur> [add/remove]'
    added: '%prefix% <green><color:#C34338>%player%<green> a été exempté des vérifications de multicompte avec succès.'
    removed: '%prefix% <green>Exemption de multicompte retirée pour <color:#C34338>%player%<green> avec succès.'

  freeze:
    frozen-target: '%prefix% <yellow>Vous avez été gelé par %executor%.'
    unfrozen-target: '%prefix% <green>Vous avez été dégelé par %executor%.'

  banlist:
    usage: '%prefix% <white>Utilisation: <red>/banlist'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Bannissements Actifs</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>%player% <white>(%type%) Par: <gradient:#FF00D9:#B300FF>%executor% <white>Raison: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expire: %end_date%)'
    footer: <dark_gray><st>----------------------------------------------------

  staffhistory:
    usage: '%prefix% <white>Utilisation: <red>/staffhistory <modérateur>'
    header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historique de %executor%</gradient> <dark_gray><st>------------------
    line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Raison: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
    footer: <dark_gray><st>----------------------------------------------------

  import:
    usage: '%prefix% <white>Utilisation: <red>/wapeb import <source> [fichier/base_de_données]'
    unknown-source: '%prefix% <red>Source d''importation inconnue: <yellow>%source%<red>. Sources disponibles: <white>%sources%'
    started: '%prefix% <yellow>Démarrage de l''importation depuis <gold>%source%<yellow>... Veuillez patienter!'
    success: '%prefix% <green>✔ Importation réussie depuis <gold>%source% <gray>(<white>%duration%ms<gray>)'
    summary: '%prefix% <gray>Importé: <green>%imported% <gray>| Ignoré: <yellow>%skipped% <gray>| Échoué: <red>%failed%'
    failed: '%prefix% <red>✖ Échec de l''importation depuis <gold>%source%!'
    list-header: '<gold>--- [ <yellow>Importateurs wapeB</yellow> ] ---</gold>'
    list-line: '<yellow>• <green>%source%</green> <gray>- %description%</gray>'

lockdown:
  bypass-permission: wapeb.lockdown.bypass
  kick-reason:
    - <b><gradient:#FA0707:#F84A1D>COOLNETWORK</gradient></b>
    - <dark_gray><st>                           <reset>
    - <b><gradient:#C34338:#C63528>WHITELIST</gradient></b>
    - ''
    - <white>Bonjour! Notre serveur est actuellement en maintenance.
    - '<white>Raison: <gradient:#C34338:#C63528>%reason%</gradient>'
  messages:
    enabled: '%prefix% <green>Le verrouillage du serveur a été activé.'
    disabled: '%prefix% <green>Le verrouillage du serveur a été désactivé.'
    usage: '%prefix% <white>Utilisation: <red>/lockdown <on|off> [raison]'
    reason-set: '%prefix% <green>Raison du verrouillage définie sur: <white>%reason%'
    status: '%prefix% <white>Statut du verrouillage: <gradient:#FF00D9:#B300FF>%status% <white>Raison: <gradient:#FF00D9:#B300FF>%reason%'

freeze:
  usage: '%prefix% <white>Utilisation: <red>/freeze <joueur> [raison]'
  ban-reason: Déconnexion pendant le freeze
  ban-duration: 30d
  messages:
    frozen: '%prefix% <yellow>Vous avez été gelé par %executor%.'
    unfrozen: '%prefix% <green>Vous avez été dégelé par %executor%.'
    frozen-success: '%prefix% <green>%player% a été gelé avec succès.'
    unfrozen-success: '%prefix% <green>%player% a été dégelé avec succès.'
    already-frozen: '%prefix% <red>Le joueur est déjà gelé.'
    not-frozen: '%prefix% <red>Le joueur n''est pas gelé.'
    logout-ban-broadcast: '%prefix% <color:#C34338>%player% <white>a été banni pour s''être déconnecté en freeze.'
    freeze-screen:
      - ''
      - '%prefix% <white>Vous êtes gelé!'
      - ''
      - <white>Ne vous déconnectez pas sous peine de bannissement.

alts:
  usage: '%prefix% <white>Utilisation: <red>/alts <joueur>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Comptes secondaires de %player% (%alt_count%)</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- %status% <color:#C34338>%alt_player%</color> %tags% <gray>(Dernière connexion: %last_seen%)'
  footer: <dark_gray><st>----------------------------------------------------
  status:
    banned: '<red><bold>[BANNI]</bold></red>'
    muted: '<yellow><bold>[MUTE]</bold></yellow>'
    online: '<green>[EN LIGNE]</green>'
    clean: '<gray>[PROPRE]</gray>'
  status-colors:
    online: <green>[EN LIGNE]</green>
    clean: <gray>[PROPRE]</gray>
    banned: <red><bold>[BANNI]</bold></red>
    muted: <yellow><bold>[MUTE]</bold></yellow>
    none: <white>[PROPRE]</white>
  tags:
    exempt: '<gradient:#00FFCC:#0099FF>[🛡 EXEMPTÉ]</gradient>'
    cidr: '<dark_purple>[CIDR /24]</dark_purple>'
  login-notification: '%prefix% <red>%player% <white>s''est connecté avec des multicomptes! IP: <color:#C34338>%ip_address%'

banlist:
  usage: '%prefix% <white>Utilisation: <red>/banlist'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Bannissements Actifs</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>%player% <white>(%type%) Par: <gradient:#FF00D9:#B300FF>%executor% <white>Raison: <gradient:#EC00E3:#D900EC>%reason% <gray>(Expire: %end_date%)'
  footer: <dark_gray><st>----------------------------------------------------

staffhistory:
  usage: '%prefix% <white>Utilisation: <red>/staffhistory <modérateur>'
  header: <dark_gray><st>------------------</st> <gradient:#FF00D9:#B300FF>Historique de %executor%</gradient> <dark_gray><st>------------------
  line: '<dark_gray>- <gray>[#%punishment_id%] <red>%type% <white>%player% <white>Raison: <gradient:#EC00E3:#D900EC>%reason% <gray>(%date%)'
  footer: <dark_gray><st>----------------------------------------------------

web-api:
  messages:
    login-code: '%prefix% <white>Votre code de connexion est: <gradient:#FF00D9:#B300FF><bold>%code%</bold></gradient>'
    unlink-success: '%prefix% <green>Toutes les sessions web actives ont été déconnectées.'

sentinel:
  messages:
    word-filter-blocked: '%prefix% <red>Votre message a été bloqué en raison d''un contenu inapproprié.'
    spam-blocked: '%prefix% <red>Votre message a été bloqué pour spam.'
    flood-blocked: '%prefix% <red>Votre message a été bloqué pour flood.'
    auto-muted: '%prefix% <red>Vous avez été mute pour %duration% en raison d''infractions au chat.'
    ai-muted: '%prefix% <red>Vous avez été mute pour %duration% par la modération IA: %reason%'
    auto-mute-broadcast: '%prefix% <gradient:#FF00D9:#B300FF>%player% <white>a été mute par Sentinel pour %duration%. Raison: %reason%'
    ai-mute-broadcast: '%prefix% <color:#C34338>%player% <white>a été mute par Sentinel IA.'

gui:
  title: 'Sanctionner: %player%'
  items:
    ban_1d:
      material: 'REDSTONE'
      name: '<red>Ban 1 Jour'
      lore:
        - '<gray>Bannir le joueur pour 1 jour'
    ban_perm:
      material: 'BEDROCK'
      name: '<dark_red>Ban Permanent'
      lore:
        - '<gray>Bannir le joueur définitivement'