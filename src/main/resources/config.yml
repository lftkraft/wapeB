# wapeB Punishment Plugin Configuration

# --- General Settings ---
storage-method: sqlite # Available: yaml, sqlite
prefix: <b><gradient:#C34338:#C63528>BÜNTETÉS</gradient></b> <dark_gray>»
console-name: Hawaii # Konzol neve Sentinelre változtatva
language: en # Available languages: en, hu, de, fr, es, pt, ru, ro, da, sv, custom

# --- Dynamic Command Overrides & Custom Aliases ---
command-overrides:
  ban:
    - kitiltas
  mute:
    - nemit
  freeze:
    - lefagyaszt
  warn:
    - figyelmeztetes

# --- Warning Settings ---
warning-expiry: 3d # 0 = Never expire. Example: 3d, 1h, 1w

# --- Warn-Action Threshold Escalation ---
warn-actions:
  enabled: true
  actions:
    3: "tempmute %player% 1h Automatikus figyelmeztetési korlát elérve (3 warn) -s"
    5: "tempban %player% 1d Automatikus figyelmeztetési korlát elérve (5 warn) -s"
    10: "ban %player% Automatikus figyelmeztetési korlát elérve (10 warn) -s"

# --- Alt Account Settings ---
alts:
  cidr-matching: true # If true, also matches alt accounts on the same /24 subnet (192.168.1.*)

# --- Discord Webhook Settings ---
discord-webhook:
  enabled: true
  url: YOUR_DISCORD_WEBHOOK_URL_HERE
  username: COOLNETWORK Szankciók
  avatar-url: https://imgur.com/a/xZUi7gr
  embed:
    color: 12796728 # Hex #C34338 as decimal
    show-avatar: true

# --- Punishment GUI Settings ---
gui:
  title: '<dark_gray>Punish: <gradient:#FF00D9:#B300FF>%player%</gradient>'
  items:
    ban:
      material: RED_CONCRETE
      reason: Permanent suspension
      duration: '-1'
    tempban:
      material: ORANGE_CONCRETE
      reason: Rule violations
      duration: 7d
    mute:
      material: YELLOW_CONCRETE
      reason: Chat violation
      duration: '-1'
    tempmute:
      material: LIME_CONCRETE
      reason: Minor chat violation
      duration: 1h
    warn:
      material: WHITE_CONCRETE
      reason: Be careful!
    kick:
      material: BARRIER
      reason: Kicked by staff

# --- Lockdown Settings ---
lockdown:
  enabled: true
  reason: A szerveren karbantartás van.
  bypass-permission: wapeb.lockdown.bypass

# --- Freeze Settings ---
freeze:
  ban-duration: 7d
  ban-reason: Kilépett freeze alatt.

# --- Web API Settings ---
web-api:
  enabled: true
  port: 30842
  api-key: trpzw345uwe49txfgbOhdG_DFGDVCXAer432

# --- Sentinel Settings ---
sentinel:
  enabled: true
  bypass-permission: wapeb.sentinel.bypass
  word-filter:
    enabled: true
    banned-words:
      - fuck
      - shit
      - bitch
      - asshole
      - kurva
      - geci
      - picsa
      - fasz
      - baszd
      - anyád
      - pina
      - szopj
      - fck
      - sh1t
      - b1tch
      - krv
      - gci
      - pina
      - f*ck
      - s*it
      - b*tch
    banned-phrases:
      - mother fucker
      - son of a bitch
      - go to hell
      - bassza meg
      - anyád picsája
      - szopd le
    auto-mute-threshold: 3
    auto-mute-duration: 30m
    auto-mute-reason: Chat helytelen használata
  spam-flood:
    enabled: true
    spam-threshold: 5
    spam-timeframe: 5s
    flood-threshold: 3
    flood-timeframe: 10s
  ai:
    enabled: true
    name: COOLNETWORK AI
    groq-api-key: YOUR_GROQ_API_KEY_HERE
    groq-model: llama-3.3-70b-versatile
    prompt: 'Feladatod egy magyar nyelvű Minecraft szerver chatjének moderálása. 
      Csak a SÚLYOS szabálysértéseket büntesd: durva káromkodás, rasszizmus, hirdetés, súlyos toxicitás.
      NE büntesd a normál játékmenettel kapcsolatos mondatokat, stratégiákat vagy baráti beszélgetést.
      A "egyszerre kettőt", "menjünk", "szia" és hasonló mondatok teljesen elfogadhatóak.
      Légy elnéző a rövidítésekkel és a szlenggel szemben.
      Válaszolj JSON formátumban: {"should_mute": boolean, "reason": "rövid indok magyarul"}'
    max-retries: 5
    retry-delay-seconds: 30
    ai-mute-duration: 20m
    ai-mute-reason-prefix: 'Chat helytelen használata - '
