# wapeB Punishment Plugin Configuration

# --- General Settings ---
storage-method: sqlite # Available: yaml, sqlite
prefix: <b><gradient:#C34338:#C63528>BÜNTETÉS</gradient></b> <dark_gray>»
console-name: Hawaii # Konzol neve Sentinelre változtatva

# --- Dynamic Command Overrides & Custom Aliases ---
command-overrides:
  ban:
    - kitiltas
  mute:
    - nemit
  freeze:
    - lefagyaszt
  warn:
    - figyelmeztetes

# --- Warning Settings ---
warning-expiry: 3d # 0 = Never expire. Example: 3d, 1h, 1w

# --- Punishment Type Display Names ---
punishment-types:
  BAN: Ban
  TEMPBAN: Temp-Ban
  IPBAN: IP-Ban
  TEMPIPBAN: Temp-IP-Ban
  MUTE: Mute
  TEMPMUTE: Temp-Mute
  IPMUTE: IP-Mute
  TEMPIPMUTE: Temp-IP-Mute
  WARN: Warning
  KICK: Kick
  FREEZE_LOGOUT_BAN: Logout-Ban
  SENTINEL_AUTO_MUTE: Auto-Mute
  SENTINEL_AI_MUTE: AI-Mute

# --- Time Formats ---
time-formats:
  permanent: Örök
  year: ' év'
  week: ' hét'
  day: ' nap'
  hour: ' óra'
  minute: p
  second: mp

# --- Discord Webhook ---
discord-webhook:
  enabled: true
  url: YOUR_DISCORD_WEBHOOK_URL_HERE
  username: COOLNETWORK Szankciók
  avatar-url: https://imgur.com/a/xZUi7gr
  embed:
    color: 12796728 # Hex #C34338 as decimal
    show-avatar: true
    ban:
      title: Kitíltás
      description: |-
        Figyelem! Új kitiltás érkezett!

        **Típus:** %type%
        **Játékosnév:** %player%
        **Admin:** %executor%
        **Indok:** %reason%
        **Időtartam:** %duration%
        **ID:** #%punishment_id%
    mute:
      title: Némítás
      description: |-
        Figyelem! Új némítás érkezett!

        **Típus:** %type%
        **Játékos:** %player%
        **Admin:** %executor%
        **Indok:** %reason%
        **Időtartam:** %duration%
        **ID:** #%punishment_id%
    kick:
      title: Kirúgás
      description: |-
        Figyelem! Új kirúgás érkezett!

        **Játékos:** %player%
        **Admin:** %executor%
        **Indok:** %reason%
        **ID:** #%punishment_id%
    warn:
      title: Figyelmeztetés
      description: |-
        Figyelem! Új figyelmeztetés érkezett!

        **Játékos:** %player%
        **Admin:** %executor%
        **Indok:** %reason%
        **ID:** #%punishment_id%
    rollback:
      title: Szankció visszavonva
      description: |-
        Figyelem! Egy szankciót visszavontak!

        **Eredeti Típus:** %type%
        **Játékos:** %player%
        **Eredeti ID:** #%punishment_id%
# --- Punishment GUI ---
gui:
  title: '<dark_gray>Punish: <gradient:#FF00D9:#B300FF>%player%</gradient>'
  items:
    ban:
      material: RED_CONCRETE
      name: <red><bold>Permanent Ban
      lore:
        - <gray>Click to permanently ban
        - <gray>this player.
      reason: Permanent suspension
      duration: '-1'
    tempban:
      material: ORANGE_CONCRETE
      name: <gold><bold>7 Day Ban
      lore:
        - <gray>Click to ban for 7 days.
      reason: Rule violations
      duration: 7d
    mute:
      material: YELLOW_CONCRETE
      name: <yellow><bold>Permanent Mute
      lore:
        - <gray>Click to permanently mute.
      reason: Chat violation
      duration: '-1'
    tempmute:
      material: LIME_CONCRETE
      name: <green><bold>1 Hour Mute
      lore:
        - <gray>Click to mute for 1 hour.
      reason: Minor chat violation
      duration: 1h
    warn:
      material: WHITE_CONCRETE
      name: <white><bold>Warning
      lore:
        - <gray>Click to warn.
      reason: Be careful!
    kick:
      material: BARRIER
      name: <red><bold>Kick
      lore:
        - <gray>Click to kick.
      reason: Kicked by staff

