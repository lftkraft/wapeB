plugins {
    id 'java'
    id 'maven-publish'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'dev.azuyo'
version = '1.0.13'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT")
    // LuckPerms API
    compileOnly("net.luckperms:api:5.4")
    
    // SQLite JDBC Driver (provided by Paper/Spigot)
    compileOnly 'org.xerial:sqlite-jdbc:3.41.2.2'
    // HikariCP Connection Pool (loaded via plugin.yml libraries)
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    // MySQL / MariaDB Drivers (loaded via plugin.yml libraries)
    compileOnly 'com.mysql:mysql-connector-j:8.3.0'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    // Gson (provided by Paper/Spigot)
    compileOnly 'com.google.code.gson:gson:2.10.1'
    
    // BCrypt for password hashing (loaded via plugin.yml libraries)
    compileOnly 'org.mindrot:jbcrypt:0.4'
}

tasks {
    runServer {
        minecraftVersion("1.18.2")
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}